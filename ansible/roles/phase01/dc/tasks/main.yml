---
- name: Verify the live NORTH domain controller before changing policy
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      $Ansible.Changed = $false
      $system = Get-CimInstance Win32_ComputerSystem
      if ($system.Name -ine 'WINTERFELL' -or
          $system.Domain -ine 'north.sevenkingdoms.local' -or
          $system.DomainRole -lt 4) {
          throw 'Phase 01 DC provisioning requires WINTERFELL in NORTH.'
      }

- name: Persist anonymous SID and name translation through a dedicated NORTH GPO
  ansible.windows.win_powershell:
    script: "{{ lookup('file', role_path + '/files/anonymous-sid-translation-gpo.ps1') }}"
  become: true
  become_method: runas
  become_user: "{{ admin_user }}@north.sevenkingdoms.local"
  vars:
    ansible_become_password: "{{ lab.domains['north.sevenkingdoms.local'].domain_password }}"
  no_log: true

- name: Persist scoped anonymous RPC exposure required by the Phase 01 curriculum
  ansible.windows.win_powershell:
    script: "{{ lookup('file', role_path + '/files/anonymous-rpc-exposure-gpo.ps1') }}"
  become: true
  become_method: runas
  become_user: "{{ admin_user }}@north.sevenkingdoms.local"
  vars:
    ansible_become_password: "{{ lab.domains['north.sevenkingdoms.local'].domain_password }}"
  no_log: true

- name: Refresh WINTERFELL computer policy after Phase 01 GPO changes
  ansible.windows.win_command: gpupdate.exe /target:computer /force
  become: true
  become_method: runas
  become_user: "{{ admin_user }}@north.sevenkingdoms.local"
  vars:
    ansible_become_password: "{{ lab.domains['north.sevenkingdoms.local'].domain_password }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify effective anonymous SID and name translation after Group Policy refresh
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      $Ansible.Changed = $false
      $path = Join-Path $env:TEMP 'kingdoms-phase01-effective-policy.inf'
      try {
          $process = Start-Process -FilePath secedit.exe -ArgumentList @(
              '/export', '/cfg', $path, '/mergedpolicy', '/areas', 'SECURITYPOLICY'
          ) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
              throw "secedit export failed with exit code $($process.ExitCode)."
          }
          $match = Select-String -LiteralPath $path -Pattern '^LSAAnonymousNameLookup\s*=\s*(\d+)\s*$'
          if ($null -eq $match -or $match.Matches.Count -ne 1 -or $match.Matches[0].Groups[1].Value -ne '1') {
              throw 'Effective policy does not have LSAAnonymousNameLookup=1 after gpupdate.'
          }
          $Ansible.Result = @{ LSAAnonymousNameLookup = 1 }
      } finally {
          Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
      }
  become: true
  become_method: runas
  become_user: "{{ admin_user }}@north.sevenkingdoms.local"
  vars:
    ansible_become_password: "{{ lab.domains['north.sevenkingdoms.local'].domain_password }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify effective scoped anonymous RPC settings after Group Policy refresh
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      $Ansible.Changed = $false

      $lsa = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $server = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $actualPipes = @($server.NullSessionPipes)
      $wantedPipes = @('samr', 'lsarpc')

      if ([int]$lsa.RestrictAnonymous -ne 0) {
          throw 'Effective policy does not have RestrictAnonymous=0 after gpupdate.'
      }
      if ([int]$lsa.RestrictAnonymousSAM -ne 0) {
          throw 'Effective policy does not have RestrictAnonymousSAM=0 after gpupdate.'
      }
      if ([int]$lsa.EveryoneIncludesAnonymous -ne 0) {
          throw 'Effective policy does not have EveryoneIncludesAnonymous=0 after gpupdate.'
      }
      if ([int]$server.RestrictNullSessAccess -ne 1) {
          throw 'Effective policy does not have RestrictNullSessAccess=1 after gpupdate.'
      }
      if ($actualPipes.Count -ne $wantedPipes.Count -or
          @($actualPipes | Where-Object { $_ -notin $wantedPipes }).Count -ne 0 -or
          @($wantedPipes | Where-Object { $_ -notin $actualPipes }).Count -ne 0) {
          throw "Effective NullSessionPipes must contain only samr and lsarpc; found: $($actualPipes -join ', ')"
      }

      $Ansible.Result = @{
          RestrictAnonymous = 0
          RestrictAnonymousSAM = 0
          EveryoneIncludesAnonymous = 0
          RestrictNullSessAccess = 1
          NullSessionPipes = $actualPipes
      }
  become: true
  become_method: runas
  become_user: "{{ admin_user }}@north.sevenkingdoms.local"
  vars:
    ansible_become_password: "{{ lab.domains['north.sevenkingdoms.local'].domain_password }}"
  changed_when: false
  when: not ansible_check_mode

- name: Permit ACL-authorized anonymous directory operations in the forest
  ansible.windows.win_powershell:
    script: "{{ lookup('file', role_path + '/files/anonymous-ldap.ps1') }}"
  # Configuration NC is forest-wide. Use the existing forest-root administrator,
  # not the child-domain administrator, and perform the write on WINTERFELL.
  become: true
  become_method: runas
  become_user: "{{ admin_user }}@sevenkingdoms.local"
  vars:
    ansible_become_password: "{{ lab.domains['sevenkingdoms.local'].domain_password }}"
  no_log: true
