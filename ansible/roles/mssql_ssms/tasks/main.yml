- name: Ensure MSSQL setup directory exists
  win_file:
    path: 'C:\setup\mssql'
    state: directory

# Current SSMS bootstrapper releases require .NET Framework 4.8 on older
# Windows Server images. Detect the installed runtime from the registry rather
# than from the presence of a downloaded installer so a failed previous attempt
# cannot produce a false positive.
- name: Check Microsoft .NET Framework 4.8 runtime
  win_shell: |
    $release = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -Name Release -ErrorAction SilentlyContinue).Release
    if ($release -ge 528040) {
      Write-Output "DOTNET48_RELEASE=$release"
      exit 0
    }
    Write-Output "DOTNET48_RELEASE=$release"
    exit 1
  register: dotnet48_state
  changed_when: false
  failed_when: false

- name: Check Microsoft .NET Framework 4.8 installer exists
  win_stat:
    path: 'C:\setup\mssql\NDP48-x86-x64-AllOS-ENU.exe'
  register: dotnet48_installer
  when: dotnet48_state.rc != 0

- name: Download Microsoft .NET Framework 4.8 installer
  win_get_url:
    url: 'https://download.microsoft.com/download/f/3/a/f3a6af84-da23-40a5-8d1c-49cc10c8e76f/NDP48-x86-x64-AllOS-ENU.exe'
    dest: 'C:\setup\mssql\NDP48-x86-x64-AllOS-ENU.exe'
    checksum: '0a3a390c47e639d0f7fc65b21195fee6b7f65b066f80f70c60fab191d14b7e40'
    checksum_algorithm: sha256
  when:
    - dotnet48_state.rc != 0
    - not dotnet48_installer.stat.exists

- name: Install Microsoft .NET Framework 4.8
  win_package:
    path: 'C:\setup\mssql\NDP48-x86-x64-AllOS-ENU.exe'
    arguments: '/quiet /norestart'
    expected_return_code:
      - 0
      - 1641
      - 3010
  register: dotnet48_install
  when: dotnet48_state.rc != 0

- name: Reboot after Microsoft .NET Framework 4.8 installation
  win_reboot:
    reboot_timeout: 900
  when:
    - dotnet48_install is defined
    - dotnet48_install is changed

# GOAD was designed around SSMS 18. The floating aka.ms/ssmsfullsetup URL now
# resolves to newer SSMS bootstrapper releases which can hang indefinitely in a
# non-interactive WinRM session on the older Windows Server images used by GOAD.
# Orange-Cyberdefense/GOAD PR #516 pins the Microsoft SSMS 18 release URL for
# the same reason. Use a version-specific filename so a previously downloaded
# newer bootstrapper cannot be silently reused on a retry.
- name: Check SQL Server Management Studio 18 installer exists
  win_stat:
    path: 'C:\setup\mssql\SSMS18_installer.exe'
  register: ssms18_installer_file

- name: Download SQL Server Management Studio 18 installer
  win_get_url:
    url: 'https://go.microsoft.com/fwlink/?linkid=2199013&clcid=0x409'
    dest: 'C:\setup\mssql\SSMS18_installer.exe'
  when: not ssms18_installer_file.stat.exists

# Detect the actual executable rather than relying on one hard-coded install
# directory. This keeps retries idempotent across supported SSMS 18 layouts.
- name: Check SQL Server Management Studio installation
  win_shell: |
    $patterns = @(
      'C:\Program Files\Microsoft SQL Server Management Studio *\Common7\IDE\Ssms.exe',
      'C:\Program Files (x86)\Microsoft SQL Server Management Studio *\Common7\IDE\Ssms.exe'
    )

    $ssms = Get-ChildItem -Path $patterns -File -ErrorAction SilentlyContinue |
      Select-Object -First 1

    if ($ssms) {
      Write-Output "SSMS_PATH=$($ssms.FullName)"
      exit 0
    }

    exit 1
  register: ssms_installation
  changed_when: false
  failed_when: false

- name: Install SQL Server Management Studio 18
  win_package:
    path: 'C:\setup\mssql\SSMS18_installer.exe'
    arguments: '/install /quiet /norestart'
    expected_return_code:
      - 0
      - 1641
      - 3010
  register: install_ssms
  when: ssms_installation.rc != 0
  async: 1800
  poll: 15

- name: Reboot after SQL Server Management Studio installation
  win_reboot:
    reboot_timeout: 900
  when:
    - install_ssms is defined
    - install_ssms is changed

- name: Verify SQL Server Management Studio installation
  win_shell: |
    $patterns = @(
      'C:\Program Files\Microsoft SQL Server Management Studio *\Common7\IDE\Ssms.exe',
      'C:\Program Files (x86)\Microsoft SQL Server Management Studio *\Common7\IDE\Ssms.exe'
    )

    $ssms = Get-ChildItem -Path $patterns -File -ErrorAction SilentlyContinue |
      Select-Object -First 1

    if (-not $ssms) {
      throw 'SQL Server Management Studio executable was not found after installation'
    }

    Write-Output "SSMS_PATH=$($ssms.FullName)"
  changed_when: false
