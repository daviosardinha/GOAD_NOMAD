---
- name: Validate domain members use NT5DS time hierarchy
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $type = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters' -Name Type -ErrorAction Stop).Type

      if ($type -ine 'NT5DS') {
          throw "W32Time Type is '$type', expected NT5DS"
      }

      Write-Output 'KINGDOMS_NT5DS_MODE_OK'
  changed_when: false

- name: Keep initial NT5DS peer rediscovery delay at one minute
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient
    name: ResolvePeerBackoffMinutes
    data: 1
    type: dword
  register: kingdoms_nt5ds_backoff_minutes

- name: Prevent NT5DS peer rediscovery backoff from doubling
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient
    name: ResolvePeerBackoffMaxTimes
    data: 0
    type: dword
  register: kingdoms_nt5ds_backoff_max

- name: Reload Windows Time configuration after peer rediscovery policy check
  ansible.windows.win_shell: |
    w32tm.exe /config /update | Out-Null
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # Always execute the reload. A previous interrupted migration may already
  # have written the registry values without applying them to the live service.
  changed_when: kingdoms_nt5ds_backoff_minutes.changed or kingdoms_nt5ds_backoff_max.changed
