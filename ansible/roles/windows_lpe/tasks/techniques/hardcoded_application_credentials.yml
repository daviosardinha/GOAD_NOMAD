---
- name: Apply hardcoded application credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_hardcoded_application_credentials.user_name }}'
      $password = '{{ windows_lpe_hardcoded_application_credentials.password }}'
      $root = '{{ windows_lpe_hardcoded_application_credentials.root }}'
      $config = '{{ windows_lpe_hardcoded_application_credentials.config }}'

      $secure = ConvertTo-SecureString $password -AsPlainText -Force
      $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
      if ($existing) {
          Set-LocalUser -Name $user -Password $secure
          Enable-LocalUser -Name $user
      } else {
          New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
      }
      Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue

      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      New-Item -ItemType Directory -Path $root -Force | Out-Null
      $body = @"
      [monitoring]
      endpoint=localhost
      service_account=.\$user
      service_password=$password
      privilege=local-admin
      "@
      Set-Content -LiteralPath $config -Value $body -Encoding ASCII

      $acl = Get-Acl -LiteralPath $root
      $usersSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
      $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
          $usersSid,
          [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
          [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
          [System.Security.AccessControl.PropagationFlags]::None,
          [System.Security.AccessControl.AccessControlType]::Allow
      )
      $acl.AddAccessRule($rule) | Out-Null
      Set-Acl -LiteralPath $root -AclObject $acl

      Write-Output 'WINDOWS_LPE_HARDCODED_APPLICATION_CREDENTIALS=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset hardcoded application credentials candidate
  ansible.windows.win_powershell:
    script: |
      $user = '{{ windows_lpe_hardcoded_application_credentials.user_name }}'
      $root = '{{ windows_lpe_hardcoded_application_credentials.root }}'
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
      Write-Output 'WINDOWS_LPE_HARDCODED_APPLICATION_CREDENTIALS=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable hardcoded application credentials state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_hardcoded_application_credentials.user_name }}'
      $password = '{{ windows_lpe_hardcoded_application_credentials.password }}'
      $root = '{{ windows_lpe_hardcoded_application_credentials.root }}'
      $config = '{{ windows_lpe_hardcoded_application_credentials.config }}'
      $usersSid = 'S-1-5-32-545'

      $account = Get-LocalUser -Name $user -ErrorAction Stop
      if (-not $account.Enabled) { throw 'training application account is disabled' }
      $admin = Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -match "\\$([regex]::Escape($user))$" }
      if (-not $admin) { throw 'training application account is not a local administrator' }
      if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw 'hardcoded application configuration is missing' }

      $content = Get-Content -LiteralPath $config -Raw
      if ($content -notmatch [regex]::Escape("service_account=.\$user")) { throw 'application configuration username is missing' }
      if ($content -notmatch [regex]::Escape("service_password=$password")) { throw 'application configuration password is missing' }

      $readFound = $false
      foreach ($ace in (Get-Acl -LiteralPath $config).Access) {
          try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
          if ($sid -eq $usersSid -and $ace.AccessControlType -eq 'Allow' -and
              (($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ReadData) -ne 0 -or
               ($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ReadAndExecute) -ne 0)) {
              $readFound = $true
          }
      }
      if (-not $readFound) { throw 'BUILTIN\Users cannot read the application credential configuration' }

      if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'application credential directory is missing' }
      Write-Output 'WINDOWS_LPE_HARDCODED_APPLICATION_CREDENTIALS=VULNERABLE'
  register: windows_lpe_hardcoded_application_credentials_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable hardcoded application credentials validation
  ansible.builtin.debug:
    var: windows_lpe_hardcoded_application_credentials_vulnerable.output
  when:
    - windows_lpe_hardcoded_application_credentials_vulnerable is defined
    - windows_lpe_hardcoded_application_credentials_vulnerable.output is defined

- name: Validate clean hardcoded application credentials state
  ansible.windows.win_powershell:
    script: |
      $user = '{{ windows_lpe_hardcoded_application_credentials.user_name }}'
      $root = '{{ windows_lpe_hardcoded_application_credentials.root }}'
      if (Test-Path -LiteralPath $root) { throw 'hardcoded application credential directory still exists' }
      if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { throw 'training application account still exists' }
      Write-Output 'WINDOWS_LPE_HARDCODED_APPLICATION_CREDENTIALS=CLEAN'
  register: windows_lpe_hardcoded_application_credentials_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean hardcoded application credentials validation
  ansible.builtin.debug:
    var: windows_lpe_hardcoded_application_credentials_clean.output
  when:
    - windows_lpe_hardcoded_application_credentials_clean is defined
    - windows_lpe_hardcoded_application_credentials_clean.output is defined
