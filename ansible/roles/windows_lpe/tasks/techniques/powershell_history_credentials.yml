---
- name: Apply PowerShell history credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $target = '{{ windows_lpe_powershell_history_credentials.target_account }}'
      $user = '{{ windows_lpe_powershell_history_credentials.user_name }}'
      $password = '{{ windows_lpe_powershell_history_credentials.password }}'

      $secure = ConvertTo-SecureString $password -AsPlainText -Force
      $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
      if ($existing) {
          Set-LocalUser -Name $user -Password $secure
          Enable-LocalUser -Name $user
      } else {
          New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
      }
      Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue

      # Prefer the actual NORTH\rickon.stark profile if it already exists. A fresh
      # WS01 may not have an interactive profile yet, so fall back to a dedicated
      # stale local-admin profile-shaped artifact instead of modifying ProfileList.
      $profile = $null
      try {
          $sid = (New-Object System.Security.Principal.NTAccount($target)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $candidate = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath)
          if (Test-Path -LiteralPath $candidate -PathType Container) { $profile = $candidate }
      } catch { }

      $fallbackProfile = Join-Path $env:SystemDrive "Users\$user"
      $fallbackMarker = Join-Path $fallbackProfile '.goad-kingdoms-pshistory-profile'
      $usingFallback = $false
      if (-not $profile) {
          $usingFallback = $true
          if ((Test-Path -LiteralPath $fallbackProfile) -and -not (Test-Path -LiteralPath $fallbackMarker)) {
              throw "refusing to reuse unmanaged fallback profile path: $fallbackProfile"
          }
          New-Item -ItemType Directory -Path $fallbackProfile -Force | Out-Null
          Set-Content -LiteralPath $fallbackMarker -Value 'GOAD_KINGDOMS_PSHISTORY_PROFILE' -Encoding ASCII
          $profile = $fallbackProfile
      }

      $historyDir = Join-Path $profile 'AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine'
      $history = Join-Path $historyDir 'ConsoleHost_history.txt'
      New-Item -ItemType Directory -Path $historyDir -Force | Out-Null

      if ($usingFallback) {
          # Make only the dedicated stale-history tree readable to ordinary users.
          $acl = Get-Acl -LiteralPath $historyDir
          $usersSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $usersSid,
              [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
              [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow
          )
          $acl.AddAccessRule($rule) | Out-Null
          Set-Acl -LiteralPath $historyDir -AclObject $acl
      }

      $line = "net use \\127.0.0.1\C$ /user:.\$user $password"
      $existingLines = @()
      if (Test-Path -LiteralPath $history) { $existingLines = @(Get-Content -LiteralPath $history) }
      if ($existingLines -notcontains $line) {
          Add-Content -LiteralPath $history -Value $line -Encoding UTF8
      }

      Write-Output 'WINDOWS_LPE_POWERSHELL_HISTORY_CREDENTIALS=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset PowerShell history credentials candidate
  ansible.windows.win_powershell:
    script: |
      $target = '{{ windows_lpe_powershell_history_credentials.target_account }}'
      $user = '{{ windows_lpe_powershell_history_credentials.user_name }}'
      $password = '{{ windows_lpe_powershell_history_credentials.password }}'
      $line = "net use \\127.0.0.1\C$ /user:.\$user $password"

      # If the real target profile exists, remove only our exact injected line.
      try {
          $sid = (New-Object System.Security.Principal.NTAccount($target)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $profile = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath)
          $history = Join-Path $profile 'AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
          if (Test-Path -LiteralPath $history) {
              $remaining = @(Get-Content -LiteralPath $history | Where-Object { $_ -ne $line })
              if ($remaining.Count -gt 0) {
                  Set-Content -LiteralPath $history -Value $remaining -Encoding UTF8
              } else {
                  Remove-Item -LiteralPath $history -Force
              }
          }
      } catch { }

      # A fallback profile is owned entirely by this scenario and can be removed.
      $fallbackProfile = Join-Path $env:SystemDrive "Users\$user"
      $fallbackMarker = Join-Path $fallbackProfile '.goad-kingdoms-pshistory-profile'
      if (Test-Path -LiteralPath $fallbackMarker) {
          Remove-Item -LiteralPath $fallbackProfile -Recurse -Force
      }

      Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
      Write-Output 'WINDOWS_LPE_POWERSHELL_HISTORY_CREDENTIALS=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable PowerShell history credentials state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $target = '{{ windows_lpe_powershell_history_credentials.target_account }}'
      $user = '{{ windows_lpe_powershell_history_credentials.user_name }}'
      $password = '{{ windows_lpe_powershell_history_credentials.password }}'

      $account = Get-LocalUser -Name $user -ErrorAction Stop
      if (-not $account.Enabled) { throw 'PowerShell-history training account is disabled' }
      $admin = Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -match "\\$([regex]::Escape($user))$" }
      if (-not $admin) { throw 'PowerShell-history training account is not a local administrator' }

      $profile = $null
      $usingFallback = $false
      try {
          $sid = (New-Object System.Security.Principal.NTAccount($target)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $candidate = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath)
          if (Test-Path -LiteralPath $candidate -PathType Container) { $profile = $candidate }
      } catch { }

      if (-not $profile) {
          $usingFallback = $true
          $profile = Join-Path $env:SystemDrive "Users\$user"
          $marker = Join-Path $profile '.goad-kingdoms-pshistory-profile'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'managed fallback profile marker is missing' }
      }

      $historyDir = Join-Path $profile 'AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine'
      $history = Join-Path $historyDir 'ConsoleHost_history.txt'
      $line = "net use \\127.0.0.1\C$ /user:.\$user $password"
      if (-not (Test-Path -LiteralPath $history -PathType Leaf)) { throw 'PSReadLine history file is missing' }
      if (@(Get-Content -LiteralPath $history) -notcontains $line) { throw 'training credential line missing from PSReadLine history' }

      if ($usingFallback) {
          $usersSid = 'S-1-5-32-545'
          $readable = $false
          foreach ($ace in (Get-Acl -LiteralPath $historyDir).Access) {
              try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
              if ($sid -ne $usersSid -or $ace.AccessControlType -ne 'Allow') { continue }
              if (($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ReadAndExecute) -ne 0 -or
                  ($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ReadData) -ne 0) {
                  $readable = $true
              }
          }
          if (-not $readable) { throw 'fallback PSReadLine history is not readable by BUILTIN\Users' }
      }

      Write-Output 'WINDOWS_LPE_POWERSHELL_HISTORY_CREDENTIALS=VULNERABLE'
  register: windows_lpe_powershell_history_credentials_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable PowerShell history credentials validation
  ansible.builtin.debug:
    var: windows_lpe_powershell_history_credentials_vulnerable.output
  when:
    - windows_lpe_powershell_history_credentials_vulnerable is defined
    - windows_lpe_powershell_history_credentials_vulnerable.output is defined

- name: Validate clean PowerShell history credentials state
  ansible.windows.win_powershell:
    script: |
      $target = '{{ windows_lpe_powershell_history_credentials.target_account }}'
      $user = '{{ windows_lpe_powershell_history_credentials.user_name }}'
      $password = '{{ windows_lpe_powershell_history_credentials.password }}'
      $line = "net use \\127.0.0.1\C$ /user:.\$user $password"

      if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { throw 'PowerShell-history training account still exists' }

      try {
          $sid = (New-Object System.Security.Principal.NTAccount($target)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $profile = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty -LiteralPath $profileKey -ErrorAction Stop).ProfileImagePath)
          $history = Join-Path $profile 'AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
          if ((Test-Path -LiteralPath $history) -and (@(Get-Content -LiteralPath $history) -contains $line)) {
              throw 'training credential line remains in PSReadLine history'
          }
      } catch {
          if ($_.Exception.Message -eq 'training credential line remains in PSReadLine history') { throw }
      }

      $fallbackProfile = Join-Path $env:SystemDrive "Users\$user"
      $fallbackMarker = Join-Path $fallbackProfile '.goad-kingdoms-pshistory-profile'
      if (Test-Path -LiteralPath $fallbackMarker) { throw 'managed fallback PowerShell-history profile still exists' }

      Write-Output 'WINDOWS_LPE_POWERSHELL_HISTORY_CREDENTIALS=CLEAN'
  register: windows_lpe_powershell_history_credentials_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean PowerShell history credentials validation
  ansible.builtin.debug:
    var: windows_lpe_powershell_history_credentials_clean.output
  when:
    - windows_lpe_powershell_history_credentials_clean is defined
    - windows_lpe_powershell_history_credentials_clean.output is defined
