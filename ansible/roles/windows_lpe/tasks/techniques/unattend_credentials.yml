---
- name: Apply unattend credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_unattend_credentials.user_name }}'
      $password = '{{ windows_lpe_unattend_credentials.password }}'
      $artifact = '{{ windows_lpe_unattend_credentials.artifact }}'
      $parent = Split-Path -Parent $artifact

      $secure = ConvertTo-SecureString $password -AsPlainText -Force
      $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
      if ($existing) {
          Set-LocalUser -Name $user -Password $secure
          Enable-LocalUser -Name $user
      } else {
          New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
      }
      Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue

      New-Item -ItemType Directory -Path $parent -Force | Out-Null
      $xml = @"
      <?xml version="1.0" encoding="utf-8"?>
      <unattend xmlns="urn:schemas-microsoft-com:unattend">
        <settings pass="oobeSystem">
          <component name="Microsoft-Windows-Shell-Setup">
            <AutoLogon>
              <Username>.\$user</Username>
              <Password>
                <Value>$password</Value>
                <PlainText>true</PlainText>
              </Password>
            </AutoLogon>
          </component>
        </settings>
      </unattend>
      "@
      Set-Content -LiteralPath $artifact -Value $xml -Encoding UTF8

      $acl = Get-Acl -LiteralPath $artifact
      $usersSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
      $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
          $usersSid,
          [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
          [System.Security.AccessControl.AccessControlType]::Allow
      )
      $acl.AddAccessRule($rule) | Out-Null
      Set-Acl -LiteralPath $artifact -AclObject $acl

      Write-Output 'WINDOWS_LPE_UNATTEND_CREDENTIALS=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset unattend credentials candidate
  ansible.windows.win_powershell:
    script: |
      $user = '{{ windows_lpe_unattend_credentials.user_name }}'
      $artifact = '{{ windows_lpe_unattend_credentials.artifact }}'
      if (Test-Path -LiteralPath $artifact) { Remove-Item -LiteralPath $artifact -Force }
      Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
      Write-Output 'WINDOWS_LPE_UNATTEND_CREDENTIALS=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable unattend credentials state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_unattend_credentials.user_name }}'
      $password = '{{ windows_lpe_unattend_credentials.password }}'
      $artifact = '{{ windows_lpe_unattend_credentials.artifact }}'
      $usersSid = 'S-1-5-32-545'

      $account = Get-LocalUser -Name $user -ErrorAction Stop
      if (-not $account.Enabled) { throw 'training deployment account is disabled' }
      $admin = Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -match "\\$([regex]::Escape($user))$" }
      if (-not $admin) { throw 'training deployment account is not a local administrator' }
      if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw 'training unattend artifact is missing' }

      $content = Get-Content -LiteralPath $artifact -Raw
      if ($content -notmatch [regex]::Escape(".\$user")) { throw 'unattend artifact does not contain the training username' }
      if ($content -notmatch [regex]::Escape($password)) { throw 'unattend artifact does not contain the training password' }
      if ($content -notmatch '<PlainText>true</PlainText>') { throw 'unattend password is not represented as plaintext training material' }

      $readFound = $false
      foreach ($ace in (Get-Acl -LiteralPath $artifact).Access) {
          try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
          if ($sid -eq $usersSid -and $ace.AccessControlType -eq 'Allow' -and
              (($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ReadData) -ne 0 -or
               ($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ReadAndExecute) -ne 0)) {
              $readFound = $true
          }
      }
      if (-not $readFound) { throw 'BUILTIN\Users cannot read the unattend credential artifact' }

      Write-Output 'WINDOWS_LPE_UNATTEND_CREDENTIALS=VULNERABLE'
  register: windows_lpe_unattend_credentials_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable unattend credentials validation
  ansible.builtin.debug:
    var: windows_lpe_unattend_credentials_vulnerable.output
  when:
    - windows_lpe_unattend_credentials_vulnerable is defined
    - windows_lpe_unattend_credentials_vulnerable.output is defined

- name: Validate clean unattend credentials state
  ansible.windows.win_powershell:
    script: |
      $user = '{{ windows_lpe_unattend_credentials.user_name }}'
      $artifact = '{{ windows_lpe_unattend_credentials.artifact }}'
      if (Test-Path -LiteralPath $artifact) { throw 'unattend credential artifact still exists' }
      if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { throw 'training deployment account still exists' }
      Write-Output 'WINDOWS_LPE_UNATTEND_CREDENTIALS=CLEAN'
  register: windows_lpe_unattend_credentials_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean unattend credentials validation
  ansible.builtin.debug:
    var: windows_lpe_unattend_credentials_clean.output
  when:
    - windows_lpe_unattend_credentials_clean is defined
    - windows_lpe_unattend_credentials_clean.output is defined
