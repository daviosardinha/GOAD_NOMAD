---
- name: Apply insecure service registry candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $name = '{{ windows_lpe_insecure_service_registry.service_name }}'
      $display = '{{ windows_lpe_insecure_service_registry.display_name }}'
      $root = '{{ windows_lpe_insecure_service_registry.root }}'
      $serviceDir = '{{ windows_lpe_insecure_service_registry.service_directory }}'
      $exe = '{{ windows_lpe_insecure_service_registry.executable }}'
      $helperDir = '{{ windows_lpe_insecure_service_registry.helper_directory }}'
      $helper = '{{ windows_lpe_insecure_service_registry.helper_executable }}'
      $regPath = '{{ windows_lpe_insecure_service_registry.registry_key }}'
      $regSubkey = '{{ windows_lpe_insecure_service_registry.registry_subkey }}'
      $valueName = '{{ windows_lpe_insecure_service_registry.registry_value }}'

      $existing = Get-Service -Name $name -ErrorAction SilentlyContinue
      if ($existing) {
          Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
          & sc.exe delete $name | Out-Null
          Start-Sleep -Milliseconds 750
      }
      Remove-Item -LiteralPath $regPath -Recurse -Force -ErrorAction SilentlyContinue
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      New-Item -ItemType Directory -Path $serviceDir -Force | Out-Null
      New-Item -ItemType Directory -Path $helperDir -Force | Out-Null

      $serviceSource = @"
      using System;
      using System.Diagnostics;
      using System.ServiceProcess;
      using Microsoft.Win32;
      public sealed class KingdomConfigService : ServiceBase
      {
          public KingdomConfigService() { ServiceName = "$name"; }
          protected override void OnStart(string[] args)
          {
              try
              {
                  using (RegistryKey key = Registry.LocalMachine.OpenSubKey(@"$regSubkey"))
                  {
                      string helper = key == null ? null : key.GetValue("$valueName") as string;
                      if (!String.IsNullOrWhiteSpace(helper))
                      {
                          ProcessStartInfo psi = new ProcessStartInfo();
                          psi.FileName = helper;
                          psi.UseShellExecute = false;
                          psi.CreateNoWindow = true;
                          Process.Start(psi);
                      }
                  }
              }
              catch { }
          }
          protected override void OnStop() { }
          public static void Main() { ServiceBase.Run(new KingdomConfigService()); }
      }
      "@
      Add-Type -TypeDefinition $serviceSource -Language CSharp -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly $exe -OutputType WindowsApplication

      $helperSource = @"
      public static class KingdomConfigHelper { public static void Main() { } }
      "@
      Add-Type -TypeDefinition $helperSource -Language CSharp -OutputAssembly $helper -OutputType ConsoleApplication

      New-Item -Path 'HKLM:\SOFTWARE' -Name 'GOAD Kingdoms' -Force | Out-Null
      New-Item -Path 'HKLM:\SOFTWARE\GOAD Kingdoms' -Name 'KingdomConfigSvc' -Force | Out-Null
      New-ItemProperty -LiteralPath $regPath -Name $valueName -Value $helper -PropertyType String -Force | Out-Null

      $usersSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
      $regAcl = Get-Acl -LiteralPath $regPath
      $regRule = New-Object System.Security.AccessControl.RegistryAccessRule(
          $usersSid,
          [System.Security.AccessControl.RegistryRights]::SetValue,
          [System.Security.AccessControl.InheritanceFlags]::None,
          [System.Security.AccessControl.PropagationFlags]::None,
          [System.Security.AccessControl.AccessControlType]::Allow
      )
      $regAcl.AddAccessRule($regRule) | Out-Null
      Set-Acl -LiteralPath $regPath -AclObject $regAcl

      New-Service -Name $name -BinaryPathName ('"{0}"' -f $exe) -DisplayName $display -StartupType Manual | Out-Null
      $sddl = 'D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;CCLCSWLOCRRC;;;IU)(A;;CCLCSWLOCRRC;;;SU)(A;;RPWP;;;BU)'
      $result = & sc.exe sdset $name $sddl 2>&1
      if ($LASTEXITCODE -ne 0) { throw "sc sdset failed: $result" }

      Start-Service -Name $name
      Start-Sleep -Milliseconds 750
      Stop-Service -Name $name -Force

      Write-Output 'WINDOWS_LPE_INSECURE_SERVICE_REGISTRY=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset insecure service registry candidate
  ansible.windows.win_powershell:
    script: |
      $name = '{{ windows_lpe_insecure_service_registry.service_name }}'
      $root = '{{ windows_lpe_insecure_service_registry.root }}'
      $regPath = '{{ windows_lpe_insecure_service_registry.registry_key }}'
      $existing = Get-Service -Name $name -ErrorAction SilentlyContinue
      if ($existing) {
          Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
          & sc.exe delete $name | Out-Null
          Start-Sleep -Milliseconds 750
      }
      Remove-Item -LiteralPath $regPath -Recurse -Force -ErrorAction SilentlyContinue
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      Write-Output 'WINDOWS_LPE_INSECURE_SERVICE_REGISTRY=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable insecure service registry state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $name = '{{ windows_lpe_insecure_service_registry.service_name }}'
      $exe = '{{ windows_lpe_insecure_service_registry.executable }}'
      $helper = '{{ windows_lpe_insecure_service_registry.helper_executable }}'
      $regPath = '{{ windows_lpe_insecure_service_registry.registry_key }}'
      $valueName = '{{ windows_lpe_insecure_service_registry.registry_value }}'
      $usersSid = 'S-1-5-32-545'

      $service = Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction Stop
      if (-not $service) { throw 'KingdomConfigSvc is missing' }
      if ($service.StartName -ne 'LocalSystem') { throw "service account=$($service.StartName)" }
      if (-not $service.PathName.TrimStart().StartsWith('"')) { throw 'service path is not quoted' }
      if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'service executable missing' }
      if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'protected helper missing' }
      if ((Get-ItemProperty -LiteralPath $regPath -Name $valueName -ErrorAction Stop).$valueName -ne $helper) { throw 'unexpected configured helper path' }

      $setValue = $false
      foreach ($ace in (Get-Acl -LiteralPath $regPath).Access) {
          try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
          if ($sid -ne $usersSid -or $ace.AccessControlType -ne 'Allow') { continue }
          if (($ace.RegistryRights -band [System.Security.AccessControl.RegistryRights]::SetValue) -ne 0) { $setValue = $true }
      }
      if (-not $setValue) { throw 'BUILTIN\\Users lacks SetValue on custom privileged service configuration key' }

      foreach ($path in @($exe, $helper)) {
          foreach ($ace in (Get-Acl -LiteralPath $path).Access) {
              try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
              if ($sid -ne $usersSid -or $ace.AccessControlType -ne 'Allow') { continue }
              if (($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::WriteData) -ne 0 -or
                  ($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::ChangePermissions) -ne 0) {
                  throw "protected file is writable by Users: $path rights=$($ace.FileSystemRights)"
              }
          }
      }

      Write-Output 'WINDOWS_LPE_INSECURE_SERVICE_REGISTRY=VULNERABLE'
  register: windows_lpe_insecure_service_registry_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable insecure service registry validation
  ansible.builtin.debug:
    var: windows_lpe_insecure_service_registry_vulnerable.output
  when:
    - windows_lpe_insecure_service_registry_vulnerable is defined
    - windows_lpe_insecure_service_registry_vulnerable.output is defined

- name: Validate clean insecure service registry state
  ansible.windows.win_powershell:
    script: |
      $name = '{{ windows_lpe_insecure_service_registry.service_name }}'
      $root = '{{ windows_lpe_insecure_service_registry.root }}'
      $regPath = '{{ windows_lpe_insecure_service_registry.registry_key }}'
      if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw 'KingdomConfigSvc still exists' }
      if (Test-Path -LiteralPath $regPath) { throw 'custom insecure service registry key still exists' }
      if (Test-Path -LiteralPath $root) { throw 'insecure service registry lab directory still exists' }
      Write-Output 'WINDOWS_LPE_INSECURE_SERVICE_REGISTRY=CLEAN'
  register: windows_lpe_insecure_service_registry_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean insecure service registry validation
  ansible.builtin.debug:
    var: windows_lpe_insecure_service_registry_clean.output
  when:
    - windows_lpe_insecure_service_registry_clean is defined
    - windows_lpe_insecure_service_registry_clean.output is defined
