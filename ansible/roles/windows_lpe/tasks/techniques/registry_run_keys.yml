---
- name: Apply registry Run keys candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $root = '{{ windows_lpe_registry_run_keys.root }}'
      $stateFile = '{{ windows_lpe_registry_run_keys.state_file }}'
      $runPath = 'Registry::HKEY_LOCAL_MACHINE\{{ windows_lpe_registry_run_keys.registry_subkey }}'
      $valueName = '{{ windows_lpe_registry_run_keys.value_name }}'
      $command = '{{ windows_lpe_registry_run_keys.command }}'

      New-Item -ItemType Directory -Path $root -Force | Out-Null

      if (-not (Test-Path -LiteralPath $stateFile -PathType Leaf)) {
          $keyExisted = Test-Path -LiteralPath $runPath
          $aclSddl = $null
          $valueExists = $false
          $value = $null

          if ($keyExisted) {
              $aclSddl = (Get-Acl -LiteralPath $runPath).Sddl
              $existing = Get-ItemProperty -LiteralPath $runPath -Name $valueName -ErrorAction SilentlyContinue
              $valueExists = $null -ne $existing
              if ($valueExists) {
                  $value = [string]$existing.$valueName
                  throw "registry Run value $valueName already exists; refusing collision"
              }
          }

          [pscustomobject]@{
              key_existed = $keyExisted
              acl_sddl = $aclSddl
              value_exists = $valueExists
              value = $value
          } | ConvertTo-Json | Set-Content -LiteralPath $stateFile -Encoding UTF8
      }

      if (-not (Test-Path -LiteralPath $runPath)) {
          New-Item -Path $runPath -Force | Out-Null
      }

      New-ItemProperty -LiteralPath $runPath -Name $valueName -Value $command -PropertyType String -Force | Out-Null

      $acl = Get-Acl -LiteralPath $runPath
      $users = New-Object System.Security.Principal.NTAccount('BUILTIN','Users')
      $rule = New-Object System.Security.AccessControl.RegistryAccessRule(
          $users,
          [System.Security.AccessControl.RegistryRights]::SetValue,
          [System.Security.AccessControl.InheritanceFlags]::None,
          [System.Security.AccessControl.PropagationFlags]::None,
          [System.Security.AccessControl.AccessControlType]::Allow
      )
      $acl.AddAccessRule($rule) | Out-Null
      Set-Acl -LiteralPath $runPath -AclObject $acl

      Write-Output 'WINDOWS_LPE_REGISTRY_RUN_KEYS=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset registry Run keys candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $root = '{{ windows_lpe_registry_run_keys.root }}'
      $stateFile = '{{ windows_lpe_registry_run_keys.state_file }}'
      $runPath = 'Registry::HKEY_LOCAL_MACHINE\{{ windows_lpe_registry_run_keys.registry_subkey }}'
      $valueName = '{{ windows_lpe_registry_run_keys.value_name }}'

      if (-not (Test-Path -LiteralPath $stateFile -PathType Leaf)) {
          if (Test-Path -LiteralPath $runPath) {
              Remove-ItemProperty -LiteralPath $runPath -Name $valueName -ErrorAction SilentlyContinue
          }
          Write-Output 'WINDOWS_LPE_REGISTRY_RUN_KEYS=RESET'
          return
      }

      $state = Get-Content -LiteralPath $stateFile -Raw | ConvertFrom-Json

      if (Test-Path -LiteralPath $runPath) {
          if ([bool]$state.value_exists) {
              New-ItemProperty -LiteralPath $runPath -Name $valueName -Value ([string]$state.value) -PropertyType String -Force | Out-Null
          }
          else {
              Remove-ItemProperty -LiteralPath $runPath -Name $valueName -ErrorAction SilentlyContinue
          }

          if ([bool]$state.key_existed) {
              $acl = New-Object System.Security.AccessControl.RegistrySecurity
              $acl.SetSecurityDescriptorSddlForm([string]$state.acl_sddl)
              Set-Acl -LiteralPath $runPath -AclObject $acl
          }
          else {
              $key = Get-Item -LiteralPath $runPath
              if ($key.Property.Count -eq 0 -and $key.SubKeyCount -eq 0) {
                  Remove-Item -LiteralPath $runPath -Force
              }
              else {
                  throw 'candidate-created HKLM Run key is no longer empty after removing scenario value; refusing destructive reset'
              }
          }
      }
      elseif ([bool]$state.key_existed) {
          throw 'pre-existing HKLM Run key disappeared; refusing to fabricate original state'
      }

      Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
      Write-Output 'WINDOWS_LPE_REGISTRY_RUN_KEYS=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable registry Run keys state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $runPath = 'Registry::HKEY_LOCAL_MACHINE\{{ windows_lpe_registry_run_keys.registry_subkey }}'
      $valueName = '{{ windows_lpe_registry_run_keys.value_name }}'
      $command = '{{ windows_lpe_registry_run_keys.command }}'
      if (-not (Test-Path -LiteralPath $runPath)) { throw 'HKLM Run key is missing after apply' }
      $value = [string](Get-ItemProperty -LiteralPath $runPath -Name $valueName -ErrorAction Stop).$valueName
      if ($value -cne $command) { throw "registry Run value mismatch: $value" }

      $usersSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
      $writable = $false
      foreach ($rule in (Get-Acl -LiteralPath $runPath).Access) {
          try { $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) } catch { continue }
          if ($sid -eq $usersSid -and $rule.AccessControlType -eq 'Allow' -and (($rule.RegistryRights -band [System.Security.AccessControl.RegistryRights]::SetValue) -ne 0)) {
              $writable = $true
              break
          }
      }
      if (-not $writable) { throw 'BUILTIN\Users cannot modify the HKLM Run key' }
      Write-Output 'WINDOWS_LPE_REGISTRY_RUN_KEYS=VULNERABLE'
  register: windows_lpe_registry_run_keys_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable registry Run keys validation
  ansible.builtin.debug:
    var: windows_lpe_registry_run_keys_vulnerable.output
  when:
    - windows_lpe_registry_run_keys_vulnerable is defined
    - windows_lpe_registry_run_keys_vulnerable.output is defined

- name: Validate clean registry Run keys state
  ansible.windows.win_powershell:
    script: |
      $root = '{{ windows_lpe_registry_run_keys.root }}'
      $runPath = 'Registry::HKEY_LOCAL_MACHINE\{{ windows_lpe_registry_run_keys.registry_subkey }}'
      $valueName = '{{ windows_lpe_registry_run_keys.value_name }}'
      if (Test-Path -LiteralPath $root) { throw 'registry Run keys scenario directory still exists' }
      if (Test-Path -LiteralPath $runPath) {
          if ($null -ne (Get-ItemProperty -LiteralPath $runPath -Name $valueName -ErrorAction SilentlyContinue)) {
              throw 'registry Run keys scenario value still exists'
          }
      }
      Write-Output 'WINDOWS_LPE_REGISTRY_RUN_KEYS=CLEAN'
  register: windows_lpe_registry_run_keys_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean registry Run keys validation
  ansible.builtin.debug:
    var: windows_lpe_registry_run_keys_clean.output
  when:
    - windows_lpe_registry_run_keys_clean is defined
    - windows_lpe_registry_run_keys_clean.output is defined
