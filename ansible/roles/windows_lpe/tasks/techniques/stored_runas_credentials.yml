---
- name: Apply stored RunAs credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $owner = '{{ windows_lpe_stored_runas_credentials.owner_account }}'
      $ownerPassword = '{{ windows_lpe_stored_runas_credentials.owner_password }}'
      $runasUser = '{{ windows_lpe_stored_runas_credentials.user_name }}'
      $runasPassword = '{{ windows_lpe_stored_runas_credentials.password }}'
      $credentialTarget = '{{ windows_lpe_stored_runas_credentials.credential_target }}'
      $root = '{{ windows_lpe_stored_runas_credentials.root }}'
      $taskName = 'GOAD-Kingdoms-StoredRunAs-Seed'
      $nonce = [guid]::NewGuid().ToString('N')
      $scriptPath = Join-Path $env:ProgramData "goad-stored-runas-seed-$nonce.ps1"
      $statusPath = Join-Path $env:ProgramData "goad-stored-runas-seed-$nonce.status"
      $listPath = Join-Path $env:ProgramData "goad-stored-runas-seed-$nonce.list"

      function Remove-TransientTask {
          & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
      }

      function Invoke-OwnerTask([string] $Path, [string] $Status) {
          Remove-TransientTask
          $start = (Get-Date).AddMinutes(5).ToString('HH:mm')
          $taskCommand = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$Path`""
          $create = & schtasks.exe /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $start /RU $owner /RP $ownerPassword /RL LIMITED /F 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks create failed: $($create -join ' ')" }
          $run = & schtasks.exe /Run /TN $taskName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks run failed: $($run -join ' ')" }
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $Status -PathType Leaf)) {
              Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path -LiteralPath $Status -PathType Leaf)) {
              $query = & schtasks.exe /Query /TN $taskName /V /FO LIST 2>&1
              throw "owner task timed out: $($query -join ' ')"
          }
          $status = (Get-Content -LiteralPath $Status -Raw).Trim()
          if ($status -ne 'OK') {
              $detail = if (Test-Path -LiteralPath $listPath) { Get-Content -LiteralPath $listPath -Raw } else { '' }
              throw "owner task failed status=$status detail=$detail"
          }
          Remove-TransientTask
      }

      New-Item -ItemType Directory -Path $root -Force | Out-Null

      $secureRunas = ConvertTo-SecureString $runasPassword -AsPlainText -Force
      $existing = Get-LocalUser -Name $runasUser -ErrorAction SilentlyContinue
      if ($existing) {
          Set-LocalUser -Name $runasUser -Password $secureRunas
          Enable-LocalUser -Name $runasUser
      } else {
          New-LocalUser -Name $runasUser -Password $secureRunas -PasswordNeverExpires -AccountNeverExpires | Out-Null
      }
      Add-LocalGroupMember -Group 'Administrators' -Member $runasUser -ErrorAction SilentlyContinue

      $payload = @"
      `$ErrorActionPreference = 'Stop'
      try {
          & `$env:SystemRoot\System32\cmdkey.exe /add:'$credentialTarget' /user:'.\$runasUser' /pass:'$runasPassword' | Out-File -LiteralPath '$listPath' -Encoding utf8
          if (`$LASTEXITCODE -ne 0) { throw "cmdkey add failed exit=`$LASTEXITCODE" }
          & `$env:SystemRoot\System32\cmdkey.exe /list | Out-File -LiteralPath '$listPath' -Encoding utf8
          if (`$LASTEXITCODE -ne 0) { throw "cmdkey list failed exit=`$LASTEXITCODE" }
          'OK' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
      } catch {
          (`$_.Exception.Message + [Environment]::NewLine + (`$_ | Out-String)) | Set-Content -LiteralPath '$listPath' -Encoding utf8
          'ERROR' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
          exit 1
      }
      "@
      Set-Content -LiteralPath $scriptPath -Value $payload -Encoding UTF8
      foreach ($path in @($scriptPath, $statusPath, $listPath)) {
          if (-not (Test-Path -LiteralPath $path)) { New-Item -ItemType File -Path $path -Force | Out-Null }
          $acl = Get-Acl -LiteralPath $path
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($owner, 'Modify', 'Allow')
          $acl.AddAccessRule($rule) | Out-Null
          Set-Acl -LiteralPath $path -AclObject $acl
      }
      Remove-Item -LiteralPath $statusPath -Force

      try {
          Invoke-OwnerTask $scriptPath $statusPath
          $listing = Get-Content -LiteralPath $listPath -Raw
          if ($listing -notmatch [regex]::Escape($credentialTarget)) { throw "stored credential target missing from Rickon credential manager: $credentialTarget" }
          if ($listing -notmatch [regex]::Escape($runasUser)) { throw "stored RunAs username missing from Rickon credential manager: $runasUser" }
          @{ owner = $owner; target = $credentialTarget; user = $runasUser } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'state.json') -Encoding UTF8
      } finally {
          Remove-TransientTask
          Remove-Item -LiteralPath $scriptPath,$statusPath,$listPath -Force -ErrorAction SilentlyContinue
      }

      Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset stored RunAs credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $owner = '{{ windows_lpe_stored_runas_credentials.owner_account }}'
      $ownerPassword = '{{ windows_lpe_stored_runas_credentials.owner_password }}'
      $runasUser = '{{ windows_lpe_stored_runas_credentials.user_name }}'
      $credentialTarget = '{{ windows_lpe_stored_runas_credentials.credential_target }}'
      $root = '{{ windows_lpe_stored_runas_credentials.root }}'
      $taskName = 'GOAD-Kingdoms-StoredRunAs-Reset'
      $nonce = [guid]::NewGuid().ToString('N')
      $scriptPath = Join-Path $env:ProgramData "goad-stored-runas-reset-$nonce.ps1"
      $statusPath = Join-Path $env:ProgramData "goad-stored-runas-reset-$nonce.status"

      function Remove-TransientTask { & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null }

      $payload = @"
      `$ErrorActionPreference = 'Stop'
      try {
          & `$env:SystemRoot\System32\cmdkey.exe /delete:'$credentialTarget' 2>`$null | Out-Null
          'OK' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
      } catch {
          'ERROR' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
          exit 1
      }
      "@
      Set-Content -LiteralPath $scriptPath -Value $payload -Encoding UTF8
      New-Item -ItemType File -Path $statusPath -Force | Out-Null
      foreach ($path in @($scriptPath, $statusPath)) {
          $acl = Get-Acl -LiteralPath $path
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($owner, 'Modify', 'Allow')
          $acl.AddAccessRule($rule) | Out-Null
          Set-Acl -LiteralPath $path -AclObject $acl
      }
      Remove-Item -LiteralPath $statusPath -Force

      try {
          Remove-TransientTask
          $start = (Get-Date).AddMinutes(5).ToString('HH:mm')
          $taskCommand = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`""
          $create = & schtasks.exe /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $start /RU $owner /RP $ownerPassword /RL LIMITED /F 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks create failed: $($create -join ' ')" }
          $run = & schtasks.exe /Run /TN $taskName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks run failed: $($run -join ' ')" }
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { throw 'stored RunAs reset owner task timed out' }
          if ((Get-Content -LiteralPath $statusPath -Raw).Trim() -ne 'OK') { throw 'stored RunAs reset owner task failed' }
      } finally {
          Remove-TransientTask
          Remove-Item -LiteralPath $scriptPath,$statusPath -Force -ErrorAction SilentlyContinue
      }

      Remove-LocalUser -Name $runasUser -ErrorAction SilentlyContinue
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable stored RunAs credentials state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $owner = '{{ windows_lpe_stored_runas_credentials.owner_account }}'
      $ownerPassword = '{{ windows_lpe_stored_runas_credentials.owner_password }}'
      $runasUser = '{{ windows_lpe_stored_runas_credentials.user_name }}'
      $credentialTarget = '{{ windows_lpe_stored_runas_credentials.credential_target }}'
      $root = '{{ windows_lpe_stored_runas_credentials.root }}'
      $taskName = 'GOAD-Kingdoms-StoredRunAs-Validate'
      $nonce = [guid]::NewGuid().ToString('N')
      $scriptPath = Join-Path $env:ProgramData "goad-stored-runas-validate-$nonce.ps1"
      $statusPath = Join-Path $env:ProgramData "goad-stored-runas-validate-$nonce.status"
      $listPath = Join-Path $env:ProgramData "goad-stored-runas-validate-$nonce.list"

      $account = Get-LocalUser -Name $runasUser -ErrorAction Stop
      if (-not $account.Enabled) { throw 'stored-RunAs training account is disabled' }
      $admin = Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -match "\\$([regex]::Escape($runasUser))$" }
      if (-not $admin) { throw 'stored-RunAs training account is not a local administrator' }
      if (-not (Test-Path -LiteralPath (Join-Path $root 'state.json') -PathType Leaf)) { throw 'stored RunAs state marker missing' }

      $payload = @"
      try {
          & `$env:SystemRoot\System32\cmdkey.exe /list | Out-File -LiteralPath '$listPath' -Encoding utf8
          if (`$LASTEXITCODE -ne 0) { throw "cmdkey list failed exit=`$LASTEXITCODE" }
          'OK' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
      } catch {
          (`$_.Exception.Message + [Environment]::NewLine + (`$_ | Out-String)) | Set-Content -LiteralPath '$listPath' -Encoding utf8
          'ERROR' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
          exit 1
      }
      "@
      Set-Content -LiteralPath $scriptPath -Value $payload -Encoding UTF8
      foreach ($path in @($scriptPath, $statusPath, $listPath)) {
          if (-not (Test-Path -LiteralPath $path)) { New-Item -ItemType File -Path $path -Force | Out-Null }
          $acl = Get-Acl -LiteralPath $path
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($owner, 'Modify', 'Allow')
          $acl.AddAccessRule($rule) | Out-Null
          Set-Acl -LiteralPath $path -AclObject $acl
      }
      Remove-Item -LiteralPath $statusPath -Force

      try {
          & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
          $start = (Get-Date).AddMinutes(5).ToString('HH:mm')
          $taskCommand = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`""
          $create = & schtasks.exe /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $start /RU $owner /RP $ownerPassword /RL LIMITED /F 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks create failed: $($create -join ' ')" }
          $run = & schtasks.exe /Run /TN $taskName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks run failed: $($run -join ' ')" }
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { throw 'stored RunAs validation owner task timed out' }
          if ((Get-Content -LiteralPath $statusPath -Raw).Trim() -ne 'OK') { throw "stored RunAs validation owner task failed: $(Get-Content -LiteralPath $listPath -Raw)" }
          $listing = Get-Content -LiteralPath $listPath -Raw
          if ($listing -notmatch [regex]::Escape($credentialTarget)) { throw 'Rickon stored credential target is missing' }
          if ($listing -notmatch [regex]::Escape($runasUser)) { throw 'Rickon stored credential username is missing' }
      } finally {
          & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
          Remove-Item -LiteralPath $scriptPath,$statusPath,$listPath -Force -ErrorAction SilentlyContinue
      }

      Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=VULNERABLE'
  register: windows_lpe_stored_runas_credentials_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable stored RunAs credentials validation
  ansible.builtin.debug:
    var: windows_lpe_stored_runas_credentials_vulnerable.output
  when:
    - windows_lpe_stored_runas_credentials_vulnerable is defined
    - windows_lpe_stored_runas_credentials_vulnerable.output is defined

- name: Validate clean stored RunAs credentials state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $owner = '{{ windows_lpe_stored_runas_credentials.owner_account }}'
      $ownerPassword = '{{ windows_lpe_stored_runas_credentials.owner_password }}'
      $runasUser = '{{ windows_lpe_stored_runas_credentials.user_name }}'
      $credentialTarget = '{{ windows_lpe_stored_runas_credentials.credential_target }}'
      $root = '{{ windows_lpe_stored_runas_credentials.root }}'
      $taskName = 'GOAD-Kingdoms-StoredRunAs-CleanCheck'
      $nonce = [guid]::NewGuid().ToString('N')
      $scriptPath = Join-Path $env:ProgramData "goad-stored-runas-clean-$nonce.ps1"
      $statusPath = Join-Path $env:ProgramData "goad-stored-runas-clean-$nonce.status"
      $listPath = Join-Path $env:ProgramData "goad-stored-runas-clean-$nonce.list"

      if (Get-LocalUser -Name $runasUser -ErrorAction SilentlyContinue) { throw 'stored-RunAs training account still exists' }
      if (Test-Path -LiteralPath $root) { throw 'stored-RunAs scenario directory still exists' }

      $payload = @"
      try {
          & `$env:SystemRoot\System32\cmdkey.exe /list | Out-File -LiteralPath '$listPath' -Encoding utf8
          if (`$LASTEXITCODE -ne 0) { throw "cmdkey list failed exit=`$LASTEXITCODE" }
          'OK' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
      } catch {
          'ERROR' | Set-Content -LiteralPath '$statusPath' -Encoding ascii
          exit 1
      }
      "@
      Set-Content -LiteralPath $scriptPath -Value $payload -Encoding UTF8
      foreach ($path in @($scriptPath, $statusPath, $listPath)) {
          if (-not (Test-Path -LiteralPath $path)) { New-Item -ItemType File -Path $path -Force | Out-Null }
          $acl = Get-Acl -LiteralPath $path
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($owner, 'Modify', 'Allow')
          $acl.AddAccessRule($rule) | Out-Null
          Set-Acl -LiteralPath $path -AclObject $acl
      }
      Remove-Item -LiteralPath $statusPath -Force

      try {
          & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
          $start = (Get-Date).AddMinutes(5).ToString('HH:mm')
          $taskCommand = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`""
          $create = & schtasks.exe /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $start /RU $owner /RP $ownerPassword /RL LIMITED /F 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks create failed: $($create -join ' ')" }
          $run = & schtasks.exe /Run /TN $taskName 2>&1
          if ($LASTEXITCODE -ne 0) { throw "schtasks run failed: $($run -join ' ')" }
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { throw 'stored RunAs clean-state owner task timed out' }
          if ((Get-Content -LiteralPath $statusPath -Raw).Trim() -ne 'OK') { throw 'stored RunAs clean-state owner task failed' }
          $listing = Get-Content -LiteralPath $listPath -Raw
          if ($listing -match [regex]::Escape($credentialTarget)) { throw 'Rickon stored credential target still exists after reset' }
      } finally {
          & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
          Remove-Item -LiteralPath $scriptPath,$statusPath,$listPath -Force -ErrorAction SilentlyContinue
      }

      Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=CLEAN'
  register: windows_lpe_stored_runas_credentials_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean stored RunAs credentials validation
  ansible.builtin.debug:
    var: windows_lpe_stored_runas_credentials_clean.output
  when:
    - windows_lpe_stored_runas_credentials_clean is defined
    - windows_lpe_stored_runas_credentials_clean.output is defined
