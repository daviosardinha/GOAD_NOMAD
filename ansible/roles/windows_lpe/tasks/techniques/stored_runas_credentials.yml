---
- name: Detect pre-existing SeBatchLogonRight for stored RunAs owner
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $owner = '{{ windows_lpe_stored_runas_credentials.owner_account }}'
      $sid = (New-Object System.Security.Principal.NTAccount($owner)).Translate([System.Security.Principal.SecurityIdentifier]).Value
      $tmp = Join-Path $env:TEMP ("kingdom-batch-right-{0}.inf" -f ([guid]::NewGuid().ToString('N')))
      try {
          & secedit.exe /export /cfg $tmp /areas USER_RIGHTS | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "secedit export failed exit=$LASTEXITCODE" }
          $line = Get-Content -LiteralPath $tmp | Where-Object { $_ -match '^\s*SeBatchLogonRight\s*=' } | Select-Object -First 1
          $entries = if ($line) { @(($line -split '=', 2)[1] -split ',' | ForEach-Object { $_.Trim() }) } else { @() }
          $present = ($entries -contains "*$sid") -or ($entries -contains $sid) -or ($entries -contains $owner)
          Write-Output ($present.ToString().ToLowerInvariant())
      } finally {
          Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
      }
  register: windows_lpe_stored_runas_batch_right_before
  when: windows_lpe_action != 'status'

- name: Exercise stored RunAs credential lifecycle in owner context
  block:
    - name: Temporarily grant SeBatchLogonRight to stored RunAs owner
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users:
          - '{{ windows_lpe_stored_runas_credentials.owner_account }}'
        action: add

    - name: Manage stored RunAs credential candidate
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'

          $action = '{{ windows_lpe_action }}'
          $validateState = '{{ windows_lpe_validate_state }}'
          $owner = '{{ windows_lpe_stored_runas_credentials.owner_account }}'
          $ownerPassword = '{{ windows_lpe_stored_runas_credentials.owner_password }}'
          $runasUser = '{{ windows_lpe_stored_runas_credentials.user_name }}'
          $runasPassword = '{{ windows_lpe_stored_runas_credentials.password }}'
          $credentialTarget = '{{ windows_lpe_stored_runas_credentials.credential_target }}'
          $root = '{{ windows_lpe_stored_runas_credentials.root }}'
          $stateFile = Join-Path $root 'state.json'
          $powershellExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $exchangeRoot = Join-Path $env:ProgramData 'GOAD-Kingdoms'
          $runtimeTarget = "$env:COMPUTERNAME\$runasUser"

          if ($credentialTarget -ine $runtimeTarget) {
              throw "stored RunAs target mismatch configured=$credentialTarget runtime=$runtimeTarget"
          }

          # RUNAS /savecred uses an undocumented Interactive Logon variant of a
          # CRED_TYPE_DOMAIN_PASSWORD credential. Community reproductions of the
          # native RUNAS format use Flags=8196 and an ANSI password blob. Keep
          # this isolated behind a live proof instead of treating it as a stable
          # documented WinCred contract.
          $credentialInteropSource = @'
using System;
using System.ComponentModel;
using System.Runtime.InteropServices;
using System.Text;

public static class KingdomInteractiveCredential
{
    [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
    public struct CREDENTIAL
    {
        public uint Flags;
        public uint Type;
        [MarshalAs(UnmanagedType.LPWStr)] public string TargetName;
        [MarshalAs(UnmanagedType.LPWStr)] public string Comment;
        public System.Runtime.InteropServices.ComTypes.FILETIME LastWritten;
        public uint CredentialBlobSize;
        public IntPtr CredentialBlob;
        public uint Persist;
        public uint AttributeCount;
        public IntPtr Attributes;
        [MarshalAs(UnmanagedType.LPWStr)] public string TargetAlias;
        [MarshalAs(UnmanagedType.LPWStr)] public string UserName;
    }

    [DllImport("advapi32.dll", EntryPoint = "CredWriteW", CharSet = CharSet.Unicode, SetLastError = true)]
    static extern bool CredWriteW(ref CREDENTIAL credential, uint flags);

    [DllImport("advapi32.dll", EntryPoint = "CredDeleteW", CharSet = CharSet.Unicode, SetLastError = true)]
    static extern bool CredDeleteW(string targetName, uint type, uint flags);

    public static void WriteInteractive(string target, string username, string password)
    {
        byte[] blobBytes = Encoding.ASCII.GetBytes(password);
        if (Encoding.ASCII.GetString(blobBytes) != password)
            throw new InvalidOperationException("stored RunAs training password must be ASCII");

        IntPtr blob = Marshal.AllocHGlobal(blobBytes.Length);
        try
        {
            Marshal.Copy(blobBytes, 0, blob, blobBytes.Length);

            CREDENTIAL credential = new CREDENTIAL();
            credential.Flags = 8196;
            credential.Type = 2;
            credential.TargetName = target;
            credential.CredentialBlobSize = (uint)blobBytes.Length;
            credential.CredentialBlob = blob;
            credential.Persist = 3;
            credential.UserName = username;

            if (!CredWriteW(ref credential, 0))
                throw new Win32Exception(Marshal.GetLastWin32Error(), "CredWriteW interactive credential failed");
        }
        finally
        {
            for (int i = 0; i < blobBytes.Length; i++) Marshal.WriteByte(blob, i, 0);
            Marshal.FreeHGlobal(blob);
        }
    }

    public static void DeleteInteractive(string target)
    {
        if (!CredDeleteW(target, 2, 0))
        {
            int error = Marshal.GetLastWin32Error();
            if (error != 1168 && error != 87)
                throw new Win32Exception(error, "CredDeleteW interactive credential failed");
        }
    }
}
'@
          $credentialInteropB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($credentialInteropSource))

          function Remove-TransientTask([string] $TaskName) {
              Stop-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
              Unregister-ScheduledTask -TaskName $TaskName -Confirm:$false -ErrorAction SilentlyContinue
          }

          function Invoke-OwnerPayload([string] $Purpose, [string] $Payload) {
              $nonce = [guid]::NewGuid().ToString('N')
              $taskName = "GOAD-Kingdoms-StoredRunAs-$Purpose-$nonce"
              $workDir = Join-Path $exchangeRoot "StoredRunAs-$nonce"
              $scriptPath = Join-Path $workDir 'payload.ps1'
              $statusPath = Join-Path $workDir 'status.txt'
              $outputPath = Join-Path $workDir 'output.txt'

              New-Item -ItemType Directory -Path $workDir -Force | Out-Null
              $dirAcl = Get-Acl -LiteralPath $workDir
              foreach ($principal in @($owner, $runtimeTarget)) {
                  if ($principal -ieq $runtimeTarget -and -not (Get-LocalUser -Name $runasUser -ErrorAction SilentlyContinue)) { continue }
                  $dirRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                      $principal,
                      [System.Security.AccessControl.FileSystemRights]::Modify,
                      [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
                      [System.Security.AccessControl.PropagationFlags]::None,
                      [System.Security.AccessControl.AccessControlType]::Allow
                  )
                  $dirAcl.AddAccessRule($dirRule) | Out-Null
              }
              Set-Acl -LiteralPath $workDir -AclObject $dirAcl

              $Payload = $Payload.Replace('__OUTPUT_PATH__', $outputPath.Replace("'", "''"))
              $Payload = $Payload.Replace('__WORKDIR__', $workDir.Replace("'", "''"))

              $wrapped = @(
                  '$ErrorActionPreference = ''Stop'''
                  'try {'
                  $Payload
                  "    'OK' | Set-Content -LiteralPath '$statusPath' -Encoding ascii"
                  '} catch {'
                  "    (`$_.Exception.Message + [Environment]::NewLine + (`$_ | Out-String)) | Set-Content -LiteralPath '$outputPath' -Encoding utf8"
                  "    'ERROR' | Set-Content -LiteralPath '$statusPath' -Encoding ascii"
                  '    exit 1'
                  '}'
              ) -join [Environment]::NewLine
              Set-Content -LiteralPath $scriptPath -Value $wrapped -Encoding UTF8

              try {
                  Remove-TransientTask $taskName
                  $taskAction = New-ScheduledTaskAction -Execute $powershellExe -Argument "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`""
                  $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(5)
                  Register-ScheduledTask -TaskName $taskName -Action $taskAction -Trigger $trigger -User $owner -Password $ownerPassword -RunLevel Limited -Force | Out-Null
                  Start-ScheduledTask -TaskName $taskName

                  $deadline = (Get-Date).AddSeconds(60)
                  while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $statusPath -PathType Leaf)) {
                      Start-Sleep -Milliseconds 500
                  }

                  if (-not (Test-Path -LiteralPath $statusPath -PathType Leaf)) {
                      $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
                      $info = if ($task) { $task | Get-ScheduledTaskInfo } else { $null }
                      $state = if ($task) { [string]$task.State } else { 'Missing' }
                      $last = if ($info) { [uint32]$info.LastTaskResult } else { [uint32]0 }
                      throw ("owner task timed out purpose={0} state={1} last=0x{2:X8}" -f $Purpose, $state, $last)
                  }

                  $status = (Get-Content -LiteralPath $statusPath -Raw).Trim()
                  $detail = if (Test-Path -LiteralPath $outputPath -PathType Leaf) { Get-Content -LiteralPath $outputPath -Raw } else { '' }
                  if ($status -ne 'OK') { throw "owner task failed purpose=$Purpose detail=$detail" }
                  return $detail
              } finally {
                  Remove-TransientTask $taskName
                  Remove-Item -LiteralPath $workDir -Recurse -Force -ErrorAction SilentlyContinue
                  if (Test-Path -LiteralPath $exchangeRoot -PathType Container) {
                      if (@(Get-ChildItem -LiteralPath $exchangeRoot -Force -ErrorAction SilentlyContinue).Count -eq 0) {
                          Remove-Item -LiteralPath $exchangeRoot -Force -ErrorAction SilentlyContinue
                      }
                  }
              }
          }

          function Get-StoredCredentialListing {
              $payload = @(
                  "& `$env:SystemRoot\System32\cmdkey.exe /list | Set-Content -LiteralPath '__OUTPUT_PATH__' -Encoding utf8"
                  'if ($LASTEXITCODE -ne 0) { throw "cmdkey list failed exit=$LASTEXITCODE" }'
              ) -join [Environment]::NewLine
              return (Invoke-OwnerPayload 'List' $payload)
          }

          function Test-RunAsSavedCredential {
              $targetEscaped = $credentialTarget.Replace("'", "''")
              $payload = @(
                  "`$target = '$targetEscaped'"
                  "`$workDir = '__WORKDIR__'"
                  "`$proofScript = Join-Path `$workDir 'proof.ps1'"
                  "`$proofFile = Join-Path `$workDir 'runas-proof.txt'"
                  "`$proofBody = '`"RUNAS_SAVECRED_OK`" | Set-Content -LiteralPath ''' + `$proofFile.Replace(`"'`", `"''`") + ''' -Encoding ascii'"
                  'Set-Content -LiteralPath $proofScript -Value $proofBody -Encoding UTF8'
                  'Remove-Item -LiteralPath $proofFile -Force -ErrorAction SilentlyContinue'
                  "`$program = `$env:SystemRoot + '\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ' + `$proofScript"
                  '$psi = New-Object System.Diagnostics.ProcessStartInfo'
                  '$psi.FileName = $env:SystemRoot + ''\System32\runas.exe'''
                  '$psi.Arguments = "/savecred /user:$target `"$program`""'
                  '$psi.UseShellExecute = $false'
                  '$psi.CreateNoWindow = $true'
                  '$psi.RedirectStandardOutput = $true'
                  '$psi.RedirectStandardError = $true'
                  '$process = [System.Diagnostics.Process]::Start($psi)'
                  'if (-not $process.WaitForExit(15000)) {'
                  '    try { $process.Kill() } catch { }'
                  "    throw 'runas /savecred timed out waiting for saved credential'"
                  '}'
                  '$stdout = $process.StandardOutput.ReadToEnd()'
                  '$stderr = $process.StandardError.ReadToEnd()'
                  '$proofDeadline = (Get-Date).AddSeconds(10)'
                  'while ((Get-Date) -lt $proofDeadline -and -not (Test-Path -LiteralPath $proofFile -PathType Leaf)) { Start-Sleep -Milliseconds 250 }'
                  'if (-not (Test-Path -LiteralPath $proofFile -PathType Leaf)) {'
                  '    throw ("runas proof failed exit={0} stdout={1} stderr={2}" -f $process.ExitCode, $stdout.Trim(), $stderr.Trim())'
                  '}'
                  '$proof = (Get-Content -LiteralPath $proofFile -Raw).Trim()'
                  'if ($proof -ne ''RUNAS_SAVECRED_OK'') { throw "runas proof marker invalid: $proof" }'
                  "'RUNAS_SAVECRED_OK' | Set-Content -LiteralPath '__OUTPUT_PATH__' -Encoding ascii"
              ) -join [Environment]::NewLine

              $proof = Invoke-OwnerPayload 'RunAsProof' $payload
              if ($proof -notmatch 'RUNAS_SAVECRED_OK') { throw 'runas /savecred proof marker missing' }
          }

          function Assert-VulnerableState {
              $account = Get-LocalUser -Name $runasUser -ErrorAction Stop
              if (-not $account.Enabled) { throw 'stored-RunAs training account is disabled' }
              $admin = Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -match "\\$([regex]::Escape($runasUser))$" }
              if (-not $admin) { throw 'stored-RunAs training account is not a local administrator' }
              if (-not (Test-Path -LiteralPath $stateFile -PathType Leaf)) { throw 'stored RunAs state marker missing' }

              $listing = Get-StoredCredentialListing
              if ($listing -notmatch 'Domain:interactive=') { throw "interactive-logon credential type is missing: $listing" }
              if ($listing -notmatch [regex]::Escape($credentialTarget)) { throw 'Rickon interactive-logon credential target is missing' }
              if ($listing -notmatch [regex]::Escape($runasUser)) { throw 'Rickon interactive-logon credential username is missing' }

              Test-RunAsSavedCredential
          }

          function Assert-CleanState {
              if (Get-LocalUser -Name $runasUser -ErrorAction SilentlyContinue) { throw 'stored-RunAs training account still exists' }
              if (Test-Path -LiteralPath $root) { throw 'stored-RunAs scenario directory still exists' }
              $listing = Get-StoredCredentialListing
              if ($listing -match [regex]::Escape($credentialTarget)) { throw 'Rickon interactive-logon credential still exists after reset' }
          }

          if ($action -eq 'apply') {
              New-Item -ItemType Directory -Path $root -Force | Out-Null

              $secureRunas = ConvertTo-SecureString $runasPassword -AsPlainText -Force
              $existing = Get-LocalUser -Name $runasUser -ErrorAction SilentlyContinue
              if ($existing) {
                  Set-LocalUser -Name $runasUser -Password $secureRunas
                  Enable-LocalUser -Name $runasUser
              } else {
                  New-LocalUser -Name $runasUser -Password $secureRunas -PasswordNeverExpires -AccountNeverExpires | Out-Null
              }
              Add-LocalGroupMember -Group 'Administrators' -Member $runasUser -ErrorAction SilentlyContinue

              $targetEscaped = $credentialTarget.Replace("'", "''")
              $passwordEscaped = $runasPassword.Replace("'", "''")
              $seedPayload = @(
                  "`$csharp = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('$credentialInteropB64'))"
                  'Add-Type -TypeDefinition $csharp -Language CSharp'
                  "[KingdomInteractiveCredential]::WriteInteractive('$targetEscaped', '$targetEscaped', '$passwordEscaped')"
                  "& `$env:SystemRoot\System32\cmdkey.exe /list | Set-Content -LiteralPath '__OUTPUT_PATH__' -Encoding utf8"
              ) -join [Environment]::NewLine
              $seedListing = Invoke-OwnerPayload 'Seed' $seedPayload
              if ($seedListing -notmatch 'Domain:interactive=') { throw "seeded credential is not Interactive Logon: $seedListing" }
              if ($seedListing -notmatch [regex]::Escape($credentialTarget)) { throw 'seeded interactive credential target missing immediately after CredWrite' }

              @{ owner = $owner; target = $credentialTarget; user = $runasUser; type = 'Interactive Logon'; flags = 8196; blob = 'ANSI' } |
                  ConvertTo-Json | Set-Content -LiteralPath $stateFile -Encoding UTF8
              Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=APPLIED'

              Assert-VulnerableState
              Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=VULNERABLE'
          }
          elseif ($action -eq 'reset') {
              $targetEscaped = $credentialTarget.Replace("'", "''")
              $deletePayload = @(
                  "`$csharp = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('$credentialInteropB64'))"
                  'Add-Type -TypeDefinition $csharp -Language CSharp'
                  "`$target = '$targetEscaped'"
                  '[KingdomInteractiveCredential]::DeleteInteractive($target)'
                  '& $env:SystemRoot\System32\cmdkey.exe ("/delete:Domain:interactive=" + $target) 2>&1 | Out-Null'
              ) -join [Environment]::NewLine
              Invoke-OwnerPayload 'Reset' $deletePayload | Out-Null

              Remove-LocalUser -Name $runasUser -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
              Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=RESET'

              Assert-CleanState
              Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=CLEAN'
          }
          elseif ($action -eq 'validate' -and $validateState -eq 'vulnerable') {
              Assert-VulnerableState
              Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=VULNERABLE'
          }
          elseif ($action -eq 'validate' -and $validateState -eq 'clean') {
              Assert-CleanState
              Write-Output 'WINDOWS_LPE_STORED_RUNAS_CREDENTIALS=CLEAN'
          }
      register: windows_lpe_stored_runas_credentials_result
  always:
    - name: Restore pre-existing SeBatchLogonRight state for stored RunAs owner
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users:
          - '{{ windows_lpe_stored_runas_credentials.owner_account }}'
        action: remove
      when:
        - windows_lpe_stored_runas_batch_right_before is defined
        - windows_lpe_stored_runas_batch_right_before.output is defined
        - windows_lpe_stored_runas_batch_right_before.output | length > 0
        - (windows_lpe_stored_runas_batch_right_before.output[0] | string | lower) == 'false'
  when: windows_lpe_action != 'status'

- name: Show stored RunAs credential lifecycle output
  ansible.builtin.debug:
    var: windows_lpe_stored_runas_credentials_result.output
  when:
    - windows_lpe_stored_runas_credentials_result is defined
    - windows_lpe_stored_runas_credentials_result.output is defined
