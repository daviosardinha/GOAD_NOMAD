---
- name: Apply service DLL hijacking candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $name = '{{ windows_lpe_service_dll_hijacking.service_name }}'
      $display = '{{ windows_lpe_service_dll_hijacking.display_name }}'
      $root = '{{ windows_lpe_service_dll_hijacking.root }}'
      $serviceDir = '{{ windows_lpe_service_dll_hijacking.service_directory }}'
      $exe = '{{ windows_lpe_service_dll_hijacking.executable }}'
      $dll = '{{ windows_lpe_service_dll_hijacking.writable_dll }}'

      $existing = Get-Service -Name $name -ErrorAction SilentlyContinue
      if ($existing) {
          Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
          & sc.exe delete $name | Out-Null
          Start-Sleep -Milliseconds 750
      }
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      New-Item -ItemType Directory -Path $serviceDir -Force | Out-Null

      $source = @"
      using System;
      using System.Runtime.InteropServices;
      using System.ServiceProcess;
      public sealed class KingdomDllService : ServiceBase
      {
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
          private static extern IntPtr LoadLibrary(string lpFileName);
          public KingdomDllService() { ServiceName = "KingdomDllSvc"; }
          protected override void OnStart(string[] args)
          {
              LoadLibrary(@"$dll");
          }
          protected override void OnStop() { }
          public static void Main() { ServiceBase.Run(new KingdomDllService()); }
      }
      "@
      Add-Type -TypeDefinition $source -Language CSharp -ReferencedAssemblies 'System.ServiceProcess.dll' -OutputAssembly $exe -OutputType WindowsApplication
      New-Service -Name $name -BinaryPathName ('"{0}"' -f $exe) -DisplayName $display -StartupType Manual | Out-Null

      # Users may plant only the missing DLL in the parent directory. The ACE is
      # this-folder-only so it does not make the legitimate service executable
      # writable and therefore stays distinct from weak_service_binary_permissions.
      $acl = Get-Acl -LiteralPath $root
      $usersSid = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
      $rights = [System.Security.AccessControl.FileSystemRights]::CreateFiles `
          -bor [System.Security.AccessControl.FileSystemRights]::WriteData `
          -bor [System.Security.AccessControl.FileSystemRights]::ReadAndExecute `
          -bor [System.Security.AccessControl.FileSystemRights]::ReadAttributes `
          -bor [System.Security.AccessControl.FileSystemRights]::ReadPermissions `
          -bor [System.Security.AccessControl.FileSystemRights]::Synchronize
      $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
          $usersSid,
          $rights,
          [System.Security.AccessControl.InheritanceFlags]::None,
          [System.Security.AccessControl.PropagationFlags]::None,
          [System.Security.AccessControl.AccessControlType]::Allow
      )
      $acl.AddAccessRule($rule) | Out-Null
      Set-Acl -LiteralPath $root -AclObject $acl

      if (Test-Path -LiteralPath $dll) { Remove-Item -LiteralPath $dll -Force }
      Write-Output 'WINDOWS_LPE_SERVICE_DLL_HIJACKING=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset service DLL hijacking candidate
  ansible.windows.win_powershell:
    script: |
      $name = '{{ windows_lpe_service_dll_hijacking.service_name }}'
      $root = '{{ windows_lpe_service_dll_hijacking.root }}'
      $existing = Get-Service -Name $name -ErrorAction SilentlyContinue
      if ($existing) {
          Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
          & sc.exe delete $name | Out-Null
          Start-Sleep -Milliseconds 750
      }
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      Write-Output 'WINDOWS_LPE_SERVICE_DLL_HIJACKING=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable service DLL hijacking state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $name = '{{ windows_lpe_service_dll_hijacking.service_name }}'
      $root = '{{ windows_lpe_service_dll_hijacking.root }}'
      $exe = '{{ windows_lpe_service_dll_hijacking.executable }}'
      $dll = '{{ windows_lpe_service_dll_hijacking.writable_dll }}'
      $usersSid = 'S-1-5-32-545'

      $service = Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction Stop
      if (-not $service) { throw 'KingdomDllSvc is missing' }
      if ($service.StartName -ne 'LocalSystem') { throw "service account=$($service.StartName)" }
      if (-not $service.PathName.TrimStart().StartsWith('"')) { throw 'service ImagePath is not quoted' }
      if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'service executable missing' }
      if (Test-Path -LiteralPath $dll) { throw 'training DLL is already planted; apply must leave the learner payload absent' }

      $rootWritable = $false
      foreach ($ace in (Get-Acl -LiteralPath $root).Access) {
          try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
          if ($sid -eq $usersSid -and $ace.AccessControlType -eq 'Allow' -and
              (($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::WriteData) -ne 0) -and
              $ace.InheritanceFlags -eq [System.Security.AccessControl.InheritanceFlags]::None) {
              $rootWritable = $true
          }
      }
      if (-not $rootWritable) { throw 'BUILTIN\Users cannot plant the intended DLL candidate' }

      foreach ($ace in (Get-Acl -LiteralPath $exe).Access) {
          try { $sid = $ace.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { continue }
          if ($sid -eq $usersSid -and $ace.AccessControlType -eq 'Allow' -and
              (($ace.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::WriteData) -ne 0)) {
              throw 'legitimate service executable is writable by Users; technique collision detected'
          }
      }

      Write-Output 'WINDOWS_LPE_SERVICE_DLL_HIJACKING=VULNERABLE'
  register: windows_lpe_service_dll_hijacking_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable service DLL hijacking validation
  ansible.builtin.debug:
    var: windows_lpe_service_dll_hijacking_vulnerable.output
  when:
    - windows_lpe_service_dll_hijacking_vulnerable is defined
    - windows_lpe_service_dll_hijacking_vulnerable.output is defined

- name: Validate clean service DLL hijacking state
  ansible.windows.win_powershell:
    script: |
      $name = '{{ windows_lpe_service_dll_hijacking.service_name }}'
      $root = '{{ windows_lpe_service_dll_hijacking.root }}'
      if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw 'KingdomDllSvc still exists' }
      if (Test-Path -LiteralPath $root) { throw 'DLL hijack lab directory still exists' }
      Write-Output 'WINDOWS_LPE_SERVICE_DLL_HIJACKING=CLEAN'
  register: windows_lpe_service_dll_hijacking_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean service DLL hijacking validation
  ansible.builtin.debug:
    var: windows_lpe_service_dll_hijacking_clean.output
  when:
    - windows_lpe_service_dll_hijacking_clean is defined
    - windows_lpe_service_dll_hijacking_clean.output is defined
