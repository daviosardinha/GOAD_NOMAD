---
- name: Apply stored Winlogon credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_stored_winlogon_credentials.user_name }}'
      $password = '{{ windows_lpe_stored_winlogon_credentials.password }}'
      $root = '{{ windows_lpe_stored_winlogon_credentials.root }}'
      $backup = '{{ windows_lpe_stored_winlogon_credentials.backup_file }}'
      $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'

      # Snapshot the exact pre-existing Winlogon state before touching it. The
      # pinned Mayfly image may already have AutoAdminLogon enabled, so the lab
      # must be able to restore that baseline exactly during reset.
      New-Item -ItemType Directory -Path $root -Force | Out-Null
      if (-not (Test-Path -LiteralPath $backup)) {
          $current = Get-ItemProperty -LiteralPath $key
          $snapshot = [ordered]@{}
          foreach ($name in @('DefaultUserName','DefaultPassword','DefaultDomainName','AutoAdminLogon')) {
              if ($current.PSObject.Properties.Name -contains $name) {
                  $snapshot[$name] = @{ present = $true; value = [string]$current.$name }
              } else {
                  $snapshot[$name] = @{ present = $false; value = $null }
              }
          }
          $snapshot | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $backup -Encoding UTF8
      }

      $secure = ConvertTo-SecureString $password -AsPlainText -Force
      $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
      if ($existing) {
          Set-LocalUser -Name $user -Password $secure
          Enable-LocalUser -Name $user
      } else {
          New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
      }
      Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue

      # Keep the exercise from automatically signing in with the planted account.
      # If AutoAdminLogon was enabled before this candidate, reset restores that
      # exact original value together with the original Default* credentials.
      New-ItemProperty -LiteralPath $key -Name 'AutoAdminLogon' -Value '0' -PropertyType String -Force | Out-Null
      New-ItemProperty -LiteralPath $key -Name 'DefaultUserName' -Value $user -PropertyType String -Force | Out-Null
      New-ItemProperty -LiteralPath $key -Name 'DefaultPassword' -Value $password -PropertyType String -Force | Out-Null
      New-ItemProperty -LiteralPath $key -Name 'DefaultDomainName' -Value $env:COMPUTERNAME -PropertyType String -Force | Out-Null

      Write-Output 'WINDOWS_LPE_STORED_WINLOGON_CREDENTIALS=APPLIED'
  when: windows_lpe_action == 'apply'

- name: Reset stored Winlogon credentials candidate
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_stored_winlogon_credentials.user_name }}'
      $root = '{{ windows_lpe_stored_winlogon_credentials.root }}'
      $backup = '{{ windows_lpe_stored_winlogon_credentials.backup_file }}'
      $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'

      if (Test-Path -LiteralPath $backup) {
          $snapshot = Get-Content -LiteralPath $backup -Raw | ConvertFrom-Json
          foreach ($name in @('DefaultUserName','DefaultPassword','DefaultDomainName','AutoAdminLogon')) {
              $entry = $snapshot.$name
              if ($entry.present) {
                  New-ItemProperty -LiteralPath $key -Name $name -Value ([string]$entry.value) -PropertyType String -Force | Out-Null
              } else {
                  Remove-ItemProperty -LiteralPath $key -Name $name -ErrorAction SilentlyContinue
              }
          }
      } else {
          # Fail-safe cleanup for an interrupted legacy apply that created the
          # training values without a backup. Never guess at unrelated baseline
          # values; only remove values that are still exactly ours.
          $current = Get-ItemProperty -LiteralPath $key
          if ($current.DefaultUserName -eq $user) {
              Remove-ItemProperty -LiteralPath $key -Name 'DefaultUserName' -ErrorAction SilentlyContinue
          }
          if ($current.DefaultPassword -eq '{{ windows_lpe_stored_winlogon_credentials.password }}') {
              Remove-ItemProperty -LiteralPath $key -Name 'DefaultPassword' -ErrorAction SilentlyContinue
          }
          if ($current.DefaultDomainName -eq $env:COMPUTERNAME -and $current.DefaultUserName -eq $user) {
              Remove-ItemProperty -LiteralPath $key -Name 'DefaultDomainName' -ErrorAction SilentlyContinue
          }
      }

      Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
      if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
      Write-Output 'WINDOWS_LPE_STORED_WINLOGON_CREDENTIALS=RESET'
  when: windows_lpe_action == 'reset'

- name: Validate vulnerable stored Winlogon credentials state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $user = '{{ windows_lpe_stored_winlogon_credentials.user_name }}'
      $password = '{{ windows_lpe_stored_winlogon_credentials.password }}'
      $backup = '{{ windows_lpe_stored_winlogon_credentials.backup_file }}'
      $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'

      $account = Get-LocalUser -Name $user -ErrorAction Stop
      if (-not $account.Enabled) { throw 'training Winlogon account is disabled' }
      $admin = Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -match "\\$([regex]::Escape($user))$" }
      if (-not $admin) { throw 'training Winlogon account is not a local administrator' }

      $values = Get-ItemProperty -LiteralPath $key
      if ($values.DefaultUserName -ne $user) { throw "unexpected DefaultUserName=$($values.DefaultUserName)" }
      if ($values.DefaultPassword -ne $password) { throw 'DefaultPassword does not contain the training credential' }
      if ($values.DefaultDomainName -ne $env:COMPUTERNAME) { throw "unexpected DefaultDomainName=$($values.DefaultDomainName)" }
      if ($values.AutoAdminLogon -ne '0') { throw "AutoAdminLogon must be 0 while the training credential is planted; got=$($values.AutoAdminLogon)" }
      if (-not (Test-Path -LiteralPath $backup -PathType Leaf)) { throw 'Winlogon pre-state backup is missing' }

      Write-Output 'WINDOWS_LPE_STORED_WINLOGON_CREDENTIALS=VULNERABLE'
  register: windows_lpe_stored_winlogon_credentials_vulnerable
  when:
    - windows_lpe_action == 'apply' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'vulnerable')

- name: Show vulnerable stored Winlogon credentials validation
  ansible.builtin.debug:
    var: windows_lpe_stored_winlogon_credentials_vulnerable.output
  when:
    - windows_lpe_stored_winlogon_credentials_vulnerable is defined
    - windows_lpe_stored_winlogon_credentials_vulnerable.output is defined

- name: Validate clean stored Winlogon credentials state
  ansible.windows.win_powershell:
    script: |
      $user = '{{ windows_lpe_stored_winlogon_credentials.user_name }}'
      $password = '{{ windows_lpe_stored_winlogon_credentials.password }}'
      $root = '{{ windows_lpe_stored_winlogon_credentials.root }}'
      $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $values = Get-ItemProperty -LiteralPath $key
      if ($values.DefaultUserName -eq $user) { throw 'training Winlogon username is still stored' }
      if ($values.DefaultPassword -eq $password) { throw 'training Winlogon password is still stored' }
      if (Test-Path -LiteralPath $root) { throw 'Winlogon training backup directory still exists' }
      if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { throw 'training Winlogon account still exists' }
      Write-Output 'WINDOWS_LPE_STORED_WINLOGON_CREDENTIALS=CLEAN'
  register: windows_lpe_stored_winlogon_credentials_clean
  when:
    - windows_lpe_action == 'reset' or (windows_lpe_action == 'validate' and windows_lpe_validate_state == 'clean')

- name: Show clean stored Winlogon credentials validation
  ansible.builtin.debug:
    var: windows_lpe_stored_winlogon_credentials_clean.output
  when:
    - windows_lpe_stored_winlogon_credentials_clean is defined
    - windows_lpe_stored_winlogon_credentials_clean.output is defined
