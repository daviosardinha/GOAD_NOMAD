---
- name: Read NORTH directory authorization evidence
  hosts: dc02
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../ad/GOAD/data/config.json
  tasks:
    - name: Resolve recovered identities and Robb without testing passwords
      ansible.windows.win_powershell:
        script: "{{ lookup('file', '../scripts/rdp-directory-evidence.ps1') }}"
      changed_when: false
      register: rdp_directory

    - name: Verify domain memberships still match the course data
      ansible.builtin.assert:
        that:
          - (directory_groups[item] | map('lower') | sort) == (expected_members | map('lower') | sort)
        fail_msg: "Domain membership drift in {{ item }}; the RDP migration must not change domain groups."
      vars:
        directory_groups: "{{ (rdp_directory.output[0] | from_json).groups }}"
        expected_members: >-
          {{ lab.domains['north.sevenkingdoms.local'].users | dict2items
             | selectattr('value.groups', 'contains', item) | map(attribute='key') | list }}
      loop: ['Stark', 'Night Watch', 'Mormont']

- name: Validate the effective Kingdoms RDP policy without changing hosts
  hosts: "{{ rdp_target_hosts | default('dc02:srv02:ws01') }}"
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../ad/GOAD/data/config.json
  tasks:
    - name: Read effective policy and existing RDP sessions
      ansible.windows.win_powershell:
        script: "{{ lookup('file', '../scripts/rdp-host-evidence.ps1') }}"
        parameters:
          ExpectedHost: "{{ lab.hosts[dict_key].hostname }}"
          # Preserve a JSON string through Ansible's native-type conversion.
          DirectoryJson: "{{ hostvars['dc02'].rdp_directory.output[0] | from_json | to_json }}"
          RequireSessions: "{{ rdp_require_sessions | default(false) | bool }}"
      changed_when: false
      register: rdp_evidence

    - name: Display policy evidence and explicit login-test limitations
      ansible.builtin.debug:
        var: rdp_evidence.output
