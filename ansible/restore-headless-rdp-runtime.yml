---
- name: Restore the validated Kingdoms headless RDP runtime contract
  hosts: dc02
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Disable only the legacy Robb connect_bot task
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false

          $task = Get-ScheduledTask -TaskName 'connect_bot' -TaskPath '\' -ErrorAction Stop
          $principal = [string]$task.Principal.UserId

          if ($principal -ine 'NORTH\robb.stark') {
              throw "Refusing to modify connect_bot: unexpected principal '$principal'"
          }

          if ($task.State.ToString() -ne 'Disabled') {
              Disable-ScheduledTask -TaskName 'connect_bot' -TaskPath '\' -ErrorAction Stop | Out-Null
              $Ansible.Changed = $true
          }

          # The legacy task launches mstsc.exe as Robb from WINTERFELL Session 0.
          # Remove only that exact legacy process identity after disabling the task.
          foreach ($proc in @(Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue)) {
              $owner = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction SilentlyContinue
              if ($null -ne $owner -and
                  $owner.Domain -ieq 'NORTH' -and
                  $owner.User -ieq 'robb.stark') {
                  Stop-Process -Id $proc.ProcessId -Force -ErrorAction Stop
                  $Ansible.Changed = $true
              }
          }

          $verify = Get-ScheduledTask -TaskName 'connect_bot' -TaskPath '\' -ErrorAction Stop
          if ($verify.State.ToString() -ne 'Disabled') {
              throw "connect_bot state is $($verify.State), expected Disabled"
          }

          Write-Output 'KINGDOMS_CONNECT_BOT_PRINCIPAL=NORTH\robb.stark'
          Write-Output 'KINGDOMS_CONNECT_BOT_STATE=Disabled'
          Write-Output 'KINGDOMS_HEADLESS_RDP_LEGACY_CLEAN=True'
      register: headless_restore

    - name: Emit headless RDP restore markers
      ansible.builtin.debug:
        var: headless_restore.output
      changed_when: false
