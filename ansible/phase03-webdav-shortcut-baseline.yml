---
- name: Capture exact WS01 WebDAV shortcut baseline without changing the host
  hosts: ws01
  gather_facts: false
  tasks:
    - name: Capture WebClient, MRxDAV and reserved shortcut artifact state
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false

          $rickonProfile = 'C:\Users\rickon.stark'
          $rickonDesktop = Join-Path $rickonProfile 'Desktop'
          $candidateLnk = Join-Path $rickonDesktop 'phase03-webdav.lnk'
          $candidateUrl = Join-Path $rickonDesktop 'phase03-webdav.url'

          function Get-ArtifactState {
              param([string]$Path)

              if (-not (Test-Path -LiteralPath $Path)) {
                  return [ordered]@{
                      Exists = $false
                      Size = 0
                      SHA256 = $null
                  }
              }

              $item = Get-Item -LiteralPath $Path
              $hash = Get-FileHash -LiteralPath $Path -Algorithm SHA256

              return [ordered]@{
                  Exists = $true
                  Size = [int64]$item.Length
                  SHA256 = $hash.Hash.ToLowerInvariant()
              }
          }

          $webClient = Get-CimInstance Win32_Service -Filter "Name='WebClient'" -ErrorAction SilentlyContinue
          $webClientExists = ($null -ne $webClient)

          $mrxDavState = 'UNKNOWN'
          $mrxOutput = @(& sc.exe query MRxDAV 2>&1)

          foreach ($line in $mrxOutput) {
              if ([string]$line -match 'STATE\s*:\s*\d+\s+(\S+)') {
                  $mrxDavState = $Matches[1]
                  break
              }
          }

          $lnk = Get-ArtifactState -Path $candidateLnk
          $url = Get-ArtifactState -Path $candidateUrl

          $Ansible.Result = [ordered]@{
              Version = 1
              Target = 'WS01'
              User = 'NORTH\rickon.stark'
              Desktop = $rickonDesktop
              CandidateLnk = $candidateLnk
              CandidateLnkExists = $lnk.Exists
              CandidateLnkSize = $lnk.Size
              CandidateLnkSHA256 = $lnk.SHA256
              CandidateUrl = $candidateUrl
              CandidateUrlExists = $url.Exists
              CandidateUrlSize = $url.Size
              CandidateUrlSHA256 = $url.SHA256
              WebClientExists = $webClientExists
              WebClientState = if ($webClientExists) { [string]$webClient.State } else { 'ABSENT' }
              WebClientStartMode = if ($webClientExists) { [string]$webClient.StartMode } else { 'ABSENT' }
              MRxDAVState = $mrxDavState
              CapturedUTC = [DateTime]::UtcNow.ToString('o')
          }
      register: webdav_baseline

    - name: Ensure local Kingdoms config directory exists
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/.config/kingdoms"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Save exact WebDAV shortcut baseline locally
      ansible.builtin.copy:
        dest: "{{ lookup('env','HOME') }}/.config/kingdoms/phase03-webdav-baseline.json"
        content: "{{ webdav_baseline.result | to_nice_json }}\n"
        mode: '0600'
      delegate_to: localhost

    - name: Emit sanitized WebDAV shortcut baseline markers
      ansible.builtin.debug:
        msg:
          - "PHASE03_WEBDAV_BASELINE_TARGET={{ webdav_baseline.result.Target }}"
          - "PHASE03_WEBDAV_BASELINE_USER={{ webdav_baseline.result.User }}"
          - "PHASE03_WEBDAV_BASELINE_LNK_EXISTS={{ webdav_baseline.result.CandidateLnkExists }}"
          - "PHASE03_WEBDAV_BASELINE_URL_EXISTS={{ webdav_baseline.result.CandidateUrlExists }}"
          - "PHASE03_WEBDAV_BASELINE_WEBCLIENT_STATE={{ webdav_baseline.result.WebClientState }}"
          - "PHASE03_WEBDAV_BASELINE_WEBCLIENT_STARTMODE={{ webdav_baseline.result.WebClientStartMode }}"
          - "PHASE03_WEBDAV_BASELINE_MRXDAV_STATE={{ webdav_baseline.result.MRxDAVState }}"
          - "PHASE03_WEBDAV_BASELINE_FILE={{ lookup('env','HOME') }}/.config/kingdoms/phase03-webdav-baseline.json"
      changed_when: false
