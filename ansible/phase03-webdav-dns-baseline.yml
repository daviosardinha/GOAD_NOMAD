---
- name: Capture exact temporary WebDAV DNS support baseline
  hosts: dc02
  gather_facts: false
  tasks:
    - name: Capture phase03-webdav DNS record and dnsNode state
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          Import-Module DnsServer

          $zoneName = 'north.sevenkingdoms.local'
          $recordName = 'phase03-webdav'
          $root = Get-ADRootDSE

          $zoneObject = Get-ADObject -SearchBase "CN=MicrosoftDNS,DC=DomainDnsZones,$($root.defaultNamingContext)" -LDAPFilter "(&(objectClass=dnsZone)(name=$zoneName))" -Properties DistinguishedName
          if ($null -eq $zoneObject) { throw 'NORTH dnsZone object not found' }

          $records = @()
          try { $records = @(Get-DnsServerResourceRecord -ZoneName $zoneName -Name $recordName -ErrorAction Stop) }
          catch { $records = @() }

          $node = Get-ADObject -SearchBase $zoneObject.DistinguishedName -SearchScope OneLevel -LDAPFilter "(&(objectClass=dnsNode)(name=$recordName))" -Properties DistinguishedName,dNSTombstoned -ErrorAction SilentlyContinue

          $Ansible.Result = [ordered]@{
              Version = 1
              Zone = $zoneName
              RecordName = $recordName
              FQDN = "$recordName.$zoneName"
              RecordExists = [bool]($records.Count -gt 0)
              RecordCount = $records.Count
              NodeExists = [bool]($null -ne $node)
              NodeTombstoned = if ($null -ne $node) { [bool]$node.dNSTombstoned } else { $false }
              NodeDN = if ($null -ne $node) { $node.DistinguishedName } else { $null }
              CapturedUTC = [DateTime]::UtcNow.ToString('o')
          }
      register: webdav_dns_baseline

    - name: Ensure local Kingdoms config directory exists
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/.config/kingdoms"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Save WebDAV DNS support baseline locally
      ansible.builtin.copy:
        dest: "{{ lookup('env','HOME') }}/.config/kingdoms/phase03-webdav-dns-baseline.json"
        content: "{{ webdav_dns_baseline.result | to_nice_json }}\n"
        mode: '0600'
      delegate_to: localhost

    - name: Emit sanitized WebDAV DNS baseline markers
      ansible.builtin.debug:
        msg:
          - "PHASE03_WEBDAV_DNS_BASELINE_RECORD_EXISTS={{ webdav_dns_baseline.result.RecordExists }}"
          - "PHASE03_WEBDAV_DNS_BASELINE_RECORD_COUNT={{ webdav_dns_baseline.result.RecordCount }}"
          - "PHASE03_WEBDAV_DNS_BASELINE_NODE_EXISTS={{ webdav_dns_baseline.result.NodeExists }}"
          - "PHASE03_WEBDAV_DNS_BASELINE_NODE_TOMBSTONED={{ webdav_dns_baseline.result.NodeTombstoned }}"
          - "PHASE03_WEBDAV_DNS_BASELINE_FILE={{ lookup('env','HOME') }}/.config/kingdoms/phase03-webdav-dns-baseline.json"
      changed_when: false
