---
# GOAD Kingdoms M2 clean workstation foundation.
#
# This playbook intentionally plants no local-privilege-escalation scenario.
# It creates the deterministic WS01 baseline that must pass before the LPE role
# and resettable profiles are introduced.

- import_playbook: data.yml
  vars:
    data_path: "../ad/{{domain_name}}/data/"
    # This is a targeted workstation playbook. Do not gather facts from every
    # domain/server in protected zones just to initialize WS01's data context.
    data_hosts: ws01
  tags: 'data'

- name: Prepare the WS01 Windows client baseline
  hosts: ws01
  roles:
    - { role: 'common', tags: 'common', http_proxy: "{{enable_http_proxy}}" }
    - { role: 'settings/keyboard', tags: 'keyboard', layouts: "{{keyboard_layouts}}" }
    - { role: 'settings/no_updates', tags: 'no_updates' }
    # mayfly/windows10 is a Windows 10 Enterprise Evaluation image. Rearm only
    # when the TIMEBASED_EVAL grace period has actually expired, then verify it
    # after the required reboot so training sessions cannot be killed by WLMS.
    - { role: 'settings/eval_rearm', tags: 'eval_rearm' }
    - { role: 'settings/admin_password', tags: 'admin_password' }
    - { role: 'settings/hostname', tags: 'hostname' }
  vars:
    local_admin_password: "{{lab.domains[lab.hosts[dict_key].domain].domain_password}}"
    hostname: "{{lab.hosts[dict_key].hostname}}"

- name: Join WS01 to NORTH
  hosts: ws01
  roles:
    - { role: 'commonwkstn', tags: 'workstation' }
  tasks:
    # LanmanServer may run like a normal domain workstation, but WS01 is the
    # Phase 01/02 SMB negative control. Do not create a direct-hosted SMB
    # firewall exception here; a stale rule from older Kingdoms builds is
    # removed again by phase01.yml for migration safety.
    - name: Windows | Ensure SMB Server service is running on WS01
      win_service:
        name: LanmanServer
        start_mode: auto
        state: started
  vars:
    member_domain: "{{lab.hosts[dict_key].domain}}"
    domain_username: "{{admin_user}}@{{member_domain}}"
    domain_password: "{{lab.domains[member_domain].domain_password}}"

- name: Grant only the intended WS01 foothold rights
  hosts: ws01
  roles:
    - { role: 'settings/adjust_rights', tags: 'adjust_rights' }
    - { role: 'settings/user_rights', tags: 'adjust_rights' }
  vars:
    local_groups: "{{lab.hosts[dict_key].local_groups | default({}) }}"
    exact_local_groups: "{{lab.hosts[dict_key].exact_local_groups | default([]) }}"
